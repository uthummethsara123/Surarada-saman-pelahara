<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Bulk Photo Downloader - Surarada 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg-dark: #12090d;
            --card-bg: rgba(28, 14, 21, 0.85);
            --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --burgundy-glow: rgba(153, 27, 27, 0.35);
            --border-color: rgba(245, 158, 11, 0.25);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f0508;
            background-image: 
                radial-gradient(at 20% 20%, rgba(120, 20, 40, 0.4) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(180, 80, 20, 0.25) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--burgundy-glow);
            width: 100%;
            max-width: 520px;
            padding: 2.5rem;
            transition: all 0.4s ease;
        }

        .glass-card.dashboard-mode {
            max-width: 680px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            background: var(--gold-gradient);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #0f0508;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            margin-bottom: 1rem;
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #fcd34d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .form-control {
            background: rgba(15, 8, 12, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 12px;
            padding: 0.8rem 1.1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(20, 10, 16, 0.9);
            border-color: #f59e0b;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
            color: #fff;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #d4d4d8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .btn-gold {
            background: var(--gold-gradient);
            color: #0f0508;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.25);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            color: #000;
        }

        .btn-gold:disabled {
            opacity: 0.6;
            transform: none;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .progress {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            height: 22px;
        }

        .progress-bar {
            background: var(--gold-gradient);
            color: #000;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .status-badge {
            font-size: 0.9rem;
            color: #fcd34d;
            font-weight: 600;
        }

        .badge-admin {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="glass-card" id="cardContainer">

        <div id="loginPanel">
            <div class="brand-header">
                <div class="brand-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2 class="brand-title">Admin Access Portal</h2>
                <p class="brand-subtitle">Surarada 2026 Bulk Photo Exporter</p>
            </div>

            <div class="login-error" id="loginError">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="loginErrorMsg">Invalid username or password.</span>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user me-2"></i>Username</label>
                    <input type="text" id="adminUser" class="form-control" placeholder="Enter admin username" required autocomplete="off">
                </div>

                <div class="mb-4">
                    <label class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                    <input type="password" id="adminPass" class="form-control" placeholder="Enter admin password" required>
                </div>

                <button type="submit" class="btn btn-gold w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Authenticate Admin
                </button>
            </form>
        </div>

        <div id="downloaderPanel" class="d-none">
            <div class="brand-header text-center">
                <span class="badge-admin"><i class="fas fa-shield-alt me-1"></i> AUTHENTICATED SESSION</span>
                <h2 class="brand-title">Bulk Photo Exporter</h2>
                <p class="brand-subtitle">Download all participant photos directly into a structured ZIP archive.</p>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="fas fa-link me-2"></i>Google Apps Script Web App Endpoint</label>
                <input type="text" id="scriptUrl" class="form-control" value="https://script.google.com/macros/s/AKfycbzTFVn_7u_oGEeijewaNR0t8a5vARJkiuBWpOuMJVcowQdkDdaWGofaar8BRuG88VGGtQ/exec">
            </div>

            <button id="downloadBtn" class="btn btn-gold w-100 py-3 mb-3">
                <i class="fas fa-cloud-download-alt me-2"></i>Fetch & Download All Photos (.ZIP)
            </button>

            <div class="mt-4 d-none" id="statusWrapper">
                <div class="progress mb-2">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%">0%</div>
                </div>
                <div id="statusText" class="status-badge text-center">Initializing...</div>
            </div>

            <div class="text-center mt-4">
                <button id="logoutBtn" class="btn btn-link text-secondary text-decoration-none btn-sm">
                    <i class="fas fa-power-off me-1"></i>Logout Admin Session
                </button>
            </div>
        </div>

    </div>

    <script>
        const LOGIN_USER = "Suraradasaman";
        const LOGIN_PASS = "Uthum@1234";

        const loginForm = document.getElementById('loginForm');
        const loginPanel = document.getElementById('loginPanel');
        const downloaderPanel = document.getElementById('downloaderPanel');
        const cardContainer = document.getElementById('cardContainer');
        const loginError = document.getElementById('loginError');
        const loginErrorMsg = document.getElementById('loginErrorMsg');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userVal = document.getElementById('adminUser').value.trim();
            const passVal = document.getElementById('adminPass').value;

            if (userVal === LOGIN_USER && passVal === LOGIN_PASS) {
                loginError.style.display = 'none';
                loginPanel.classList.add('d-none');
                downloaderPanel.classList.remove('d-none');
                cardContainer.classList.add('dashboard-mode');
                sessionStorage.setItem("suraradaAdminAuth", "true");
            } else {
                loginErrorMsg.innerText = "Incorrect username or password.";
                loginError.style.display = 'flex';
            }
        });

        if (sessionStorage.getItem("suraradaAdminAuth") === "true") {
            loginPanel.classList.add('d-none');
            downloaderPanel.classList.remove('d-none');
            cardContainer.classList.add('dashboard-mode');
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem("suraradaAdminAuth");
            location.reload();
        });

        // Helper function to sanitize string for clean OS file naming
        function sanitizeFileName(str) {
            if (!str) return "Photo";
            return str.replace(/[^a-zA-Z0-9\s-_]/g, "").trim().replace(/\s+/g, "_");
        }

        // BULK DOWNLOAD ENGINE
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const scriptUrl = document.getElementById('scriptUrl').value.trim();
            const statusText = document.getElementById('statusText');
            const statusWrapper = document.getElementById('statusWrapper');
            const progressBar = document.getElementById('progressBar');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!scriptUrl) {
                alert("Please enter a valid Google Apps Script Web App URL.");
                return;
            }

            downloadBtn.disabled = true;
            statusWrapper.classList.remove('d-none');
            statusText.innerText = "Connecting to Google Sheet metadata database...";
            progressBar.style.width = "5%";
            progressBar.innerText = "5%";

            try {
                const response = await fetch(scriptUrl);
                const result = await response.json();

                if (!result.success || !result.images || result.images.length === 0) {
                    throw new Error("No image records found in Google Sheet database.");
                }

                const images = result.images;
                const zip = new JSZip();
                const folder = zip.folder("Surarada_2026_Photos");

                let downloadedCount = 0;

                for (let i = 0; i < images.length; i++) {
                    const item = images[i];
                    
                    // Uses the exact formatted name from Column I
                    const cleanFileName = sanitizeFileName(item.downloadFileName);
                    const ext = item.url.split('.').pop().split('?')[0] || "jpg";
                    const finalZipFileName = `${cleanFileName}.${ext}`;

                    statusText.innerText = `Downloading photo ${i + 1} of ${images.length}: ${finalZipFileName}`;

                    try {
                        const imgRes = await fetch(item.url);
                        const blob = await imgRes.blob();
                        
                        // RENAMES FILE INSIDE THE ZIP ARCHIVE
                        folder.file(finalZipFileName, blob);
                        downloadedCount++;
                    } catch (err) {
                        console.warn(`Failed to fetch image URL: ${item.url}`, err);
                    }

                    const percent = Math.round(((i + 1) / images.length) * 90);
                    progressBar.style.width = percent + "%";
                    progressBar.innerText = percent + "%";
                }

                statusText.innerText = "Compressing photos into ZIP archive...";
                progressBar.style.width = "95%";
                progressBar.innerText = "95%";

                const zipBlob = await zip.generateAsync({ type: "blob" });
                saveAs(zipBlob, "Surarada_2026_All_Photos.zip");

                progressBar.style.width = "100%";
                progressBar.innerText = "100%";
                statusText.innerText = `Successfully exported ${downloadedCount} renamed photos into ZIP archive!`;

            } catch (err) {
                statusText.innerText = "Download process failed: " + err.message;
                statusText.style.color = "#fca5a5";
            } finally {
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

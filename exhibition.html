<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Exhibition</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121212;
      }

      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      #overlay-content {
        max-width: 400px;
      }

      #startBtn {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>

    <script>
      // Global state to sync touch interaction across all tracking entities
      window.galleryState = {
        isUserTouching: false,
        touchStartPos: 0,
        deltaX: 0,
        sensitivity: 0.02,
        autoScrollSpeed: 0.015 
      };

      // Helper function to check if the screen layout is horizontal (landscape)
      function isLandscape() {
        if (screen.orientation && screen.orientation.type) {
          return screen.orientation.type.includes('landscape');
        }
        return window.innerHeight < window.innerWidth;
      }

      // Adaptive touch listeners tracking orientation modes
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          window.galleryState.isUserTouching = true;
          // In landscape mode, track Y axis swipes. In portrait, track X axis swipes.
          window.galleryState.touchStartPos = isLandscape() ? e.touches[0].clientY : e.touches[0].clientX;
          window.galleryState.deltaX = 0;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && window.galleryState.isUserTouching) {
          let currentPos = isLandscape() ? e.touches[0].clientY : e.touches[0].clientX;
          
          // Reverse direction calculation in landscape to maintain natural pulling feel
          if (isLandscape()) {
            window.galleryState.deltaX = currentPos - window.galleryState.touchStartPos;
          } else {
            window.galleryState.deltaX = currentPos - window.galleryState.touchStartPos;
          }
          
          window.galleryState.touchStartPos = currentPos;
        }
      });

      window.addEventListener('touchend', () => {
        window.galleryState.isUserTouching = false;
        window.galleryState.deltaX = 0;
      });

      // Component attached to every photo to turn it into an independent looping conveyor belt node
      AFRAME.registerComponent('conveyor-item', {
        init: function () {
          this.minZ = -8.0;
          this.maxZ = 8.0;
          this.totalSpan = 16.0;
        },

        tick: function () {
          let position = this.el.getAttribute('position');
          let currentZ = position.z;

          if (window.galleryState.isUserTouching) {
            currentZ += window.galleryState.deltaX * window.galleryState.sensitivity;
          } else {
            currentZ -= window.galleryState.autoScrollSpeed;
          }

          if (currentZ < this.minZ) {
            currentZ += this.totalSpan;
          } else if (currentZ > this.maxZ) {
            currentZ -= this.totalSpan;
          }

          this.el.setAttribute('position', {
            x: position.x,
            y: position.y,
            z: currentZ
          });
        }
      });
    </script>
  </head>
  <body>

    <div id="overlay">
      <div id="overlay-content">
        <h2 id="overlay-title">Virtual Exhibition</h2>
        <p id="overlay-desc">This experience requires camera access to overlay the artworks.</p>
        <button id="startBtn">Enter Exhibition</button>
      </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" embedded style="background: transparent;">
      <a-assets>
        <img id="imgL1" src="/assets/img/2025/c 1.jpg" crossorigin="anonymous">
        <img id="imgL2" src="/assets/img/2025/c 2.jpg" crossorigin="anonymous">
        <img id="imgL3" src="/assets/img/2025/c 3.jpg" crossorigin="anonymous">
        <img id="imgL4" src="/assets/img/2025/c merit (2).jpg" crossorigin="anonymous">
        
        <img id="imgR1" src="/assets/img/2025/m 1.jpg" crossorigin="anonymous">
        <img id="imgR2" src="/assets/img/2025/m 2.jpg" crossorigin="anonymous">
        <img id="imgR3" src="/assets/img/2025/m 3.jpg" crossorigin="anonymous">
        <img id="imgR4" src="/assets/img/2025/m merit (2).jpg" crossorigin="anonymous">
      </a-assets>

      <a-image src="#imgL1" position="-3 0 6.0" rotation="0 90 0" width="3.2" height="1.8" conveyor-item></a-image>
      <a-image src="#imgL2" position="-3 0 2.0" rotation="0 90 0" width="3.2" height="1.8" conveyor-item></a-image>
      <a-image src="#imgL3" position="-3 0 -2.0" rotation="0 90 0" width="3.2" height="1.8" conveyor-item></a-image>
      <a-image src="#imgL4" position="-3 0 -6.0" rotation="0 90 0" width="3.2" height="1.8" conveyor-item></a-image>

      <a-image src="#imgR1" position="3 0 6.0" rotation="0 -90 0" width="3.2" height="1.8" conveyor-item></a-image>
      <a-image src="#imgR2" position="3 0 2.0" rotation="0 -90 0" width="3.2" height="1.8" conveyor-item></a-image>
      <a-image src="#imgR3" position="3 0 -2.0" rotation="0 -90 0" width="3.2" height="1.8" conveyor-item></a-image>
      <a-image src="#imgR4" position="3 0 -6.0" rotation="0 -90 0" width="3.2" height="1.8" conveyor-item></a-image>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;"></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scene = document.querySelector('a-scene');
      
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      if (!isMobile) {
        overlayTitle.innerText = "Mobile Phone Recommended";
        overlayDesc.innerHTML = "For the best experience, please open this link on your mobile phone.<br><br>You can still enter on desktop by dragging your mouse to look around.";
        startBtn.innerText = "Continue anyway";
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        if (isMobile) {
          navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } 
          })
          .then((stream) => {
            video.srcObject = stream;
            video.play();
          })
          .catch((err) => {
            console.error("Camera error:", err);
            alert("Could not access camera. Please check permissions or run via HTTPS.");
          });
        } else {
          video.style.display = 'none';
          scene.style.backgroundColor = "#1a1a1a";
          
          const cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('look-controls', 'touchEnabled: true');
        }
      });
    </script>
  </body>
</html>

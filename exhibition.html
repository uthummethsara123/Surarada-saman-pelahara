<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Exhibition - Live Stream</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent;
      }

      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      #overlay-content {
        max-width: 400px;
      }

      #startBtn {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>

    <script>
      const LIVE_GET_API_URL = "https://script.google.com/macros/s/AKfycbzTFVn_7u_oGEeijewaNR0t8a5vARJkiuBWpOuMJVcowQdkDdaWGofaar8BRuG88VGGtQ/exec";

      window.galleryState = {
        isUserTouching: false,
        touchStartX: 0,
        touchStartY: 0,
        deltaZ: 0,
        sensitivity: 0.02,
        autoScrollSpeed: 0.015 
      };

      // --- MOBILE TOUCH CONTROLS ---
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.touches[0].clientX;
          window.galleryState.touchStartY = e.touches[0].clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && window.galleryState.isUserTouching) {
          handleInteractionMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      });

      window.addEventListener('touchend', () => {
        window.galleryState.isUserTouching = false;
        window.galleryState.deltaZ = 0;
      });

      // --- LAPTOP RIGHT-CLICK CONTROLS ---
      window.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.clientX;
          window.galleryState.touchStartY = e.clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (window.galleryState.isUserTouching) {
          handleInteractionMove(e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = false;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      function handleInteractionMove(currentX, currentY) {
        let diffX = currentX - window.galleryState.touchStartX;
        let diffY = currentY - window.galleryState.touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
          window.galleryState.deltaZ = diffX;
        } else {
          window.galleryState.deltaZ = -diffY; 
        }

        window.galleryState.touchStartX = currentX;
        window.galleryState.touchStartY = currentY;
      }

      AFRAME.registerComponent('conveyor-item', {
        schema: {
          totalCount: { type: 'number', default: 8 }
        },
        init: function () {
          let rowsCount = Math.ceil(this.data.totalCount / 2);
          this.minZ = -(rowsCount * 2.0);
          this.maxZ = (rowsCount * 2.0);
          this.totalSpan = this.maxZ - this.minZ;
        },
        tick: function () {
          let position = this.el.getAttribute('position');
          let currentZ = position.z;

          if (window.galleryState.isUserTouching) {
            currentZ += window.galleryState.deltaZ * window.galleryState.sensitivity;
          } else {
            currentZ -= window.galleryState.autoScrollSpeed;
          }

          if (currentZ < this.minZ) {
            currentZ += this.totalSpan;
          } else if (currentZ > this.maxZ) {
            currentZ -= this.totalSpan;
          }

          this.el.setAttribute('position', { x: position.x, y: position.y, z: currentZ });
        }
      });

      // DYNAMIC LOADER INTERACTION WITH SAFE TRANSPARENCY PIPELINE
      AFRAME.registerComponent('gallery-loader', {
        init: function () {
          const sceneEl = this.el;
          const assetsEl = document.querySelector('a-assets');
          const startBtn = document.getElementById('startBtn');

          startBtn.disabled = true;
          startBtn.innerText = "Connecting Live Feed...";

          fetch(LIVE_GET_API_URL)
            .then(res => res.json())
            .then(images => {
              if(!images || images.length === 0) {
                document.getElementById('overlay-desc').innerText = "No submitted pictures found in database yet.";
                startBtn.innerText = "Gallery Empty";
                return;
              }

              images.forEach((imgData, index) => {
                let imgAsset = document.createElement('img');
                imgAsset.setAttribute('id', `live-img-${index}`);
                imgAsset.setAttribute('src', imgData.src);
                imgAsset.setAttribute('crossorigin', 'anonymous');
                assetsEl.appendChild(imgAsset);

                let aImg = document.createElement('a-image');
                let isLeft = index % 2 === 0;
                
                let xPos = isLeft ? "-3" : "3";
                let rotation = isLeft ? "0 90 0" : "0 -90 0";
                
                let rowIndex = Math.floor(index / 2);
                let zPos = 6.0 - (rowIndex * 4.0);

                aImg.setAttribute('src', `#live-img-${index}`);
                aImg.setAttribute('position', `${xPos} 0 ${zPos}`);
                aImg.setAttribute('rotation', rotation);
                
                aImg.setAttribute('width', '3.2');
                aImg.setAttribute('height', '1.8');
                aImg.setAttribute('conveyor-item', `totalCount: ${images.length}`);
                
                if (isLeft) {
                  aImg.setAttribute('material', 'side: double');
                }

                // Adaptive Aspect Adjuster
                imgAsset.addEventListener('load', function() {
                  let width = imgAsset.naturalWidth;
                  let height = imgAsset.naturalHeight;
                  let aspectRatio = width / height;

                  let maxBoundaryWidth = 3.2;
                  let maxBoundaryHeight = 1.8;

                  if (aspectRatio > (maxBoundaryWidth / maxBoundaryHeight)) {
                    aImg.setAttribute('width', maxBoundaryWidth);
                    aImg.setAttribute('height', maxBoundaryWidth / aspectRatio);
                  } else {
                    aImg.setAttribute('height', maxBoundaryHeight);
                    aImg.setAttribute('width', maxBoundaryHeight * aspectRatio);
                  }
                });

                sceneEl.appendChild(aImg);
              });

              startBtn.disabled = false;
              const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
              startBtn.innerText = isMobile ? "Enter Exhibition" : "Start Exhibition";
            })
            .catch(err => {
              console.error("Live fetch failed:", err);
              document.getElementById('overlay-desc').innerText = "Error syncing submissions with Google Sheet.";
            });
        }
      });
    </script>
  </head>
  <body>

    <div id="overlay">
      <div id="overlay-content">
        <h2 id="overlay-title">Virtual Exhibition</h2>
        <p id="overlay-desc">Synchronizing with live data panels...</p>
        <button id="startBtn">Enter Exhibition</button>
      </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" embedded style="background: transparent;" renderer="alpha: true;" gallery-loader>
      <a-assets>
        </a-assets>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;" position="0 0 0"></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scene = document.querySelector('a-scene');
      
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      if (isMobile) {
        overlayTitle.innerText = "Mobile Exhibition Guide";
        overlayDesc.innerHTML = "• Move your phone to look around the space.<br>• Swipe your finger left/right to scroll the conveyor belt photos manually.<br><br>Camera and motion permissions are required to blend the art with your surroundings.";
      } else {
        overlayTitle.innerText = "Laptop Exhibition Guide";
        overlayDesc.innerHTML = "• <b>Look Around:</b> Click and drag with your <u>Left Mouse Button</u>.<br>• <b>Scroll Photos:</b> Click and hold your <u>Right Mouse Button</u> while dragging your trackpad/mouse left or right.";
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        if (isMobile) {
          navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } 
          })
          .then((stream) => {
            video.srcObject = stream;
            video.play();
          })
          .catch((err) => {
            console.error("Camera error:", err);
            alert("Could not access camera. Please check permissions or run via HTTPS.");
          });
        } else {
          video.style.display = 'none';
          scene.style.backgroundColor = "#1a1a1a";
          
          const cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('look-controls', 'touchEnabled: true');
        }
      });
    </script>
  </body>
</html>

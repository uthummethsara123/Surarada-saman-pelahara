<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Exhibition - Live Stream</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent !important;
      }

      /* Forces the WebGL viewports to let the camera pass through underneath */
      a-scene, .a-canvas {
        background-color: transparent !important;
        background: transparent !important;
      }

      /* Hidden by default, activated only for mobile screens */
      #webcam {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
      }

      /* Media Query: Target mobile viewports to display the physical environment stream */
      @media (max-width: 767px) {
        #webcam {
          display: block;
        }
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      #overlay-content {
        max-width: 400px;
      }

      #startBtn {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>

    <script>
      const LIVE_GET_API_URL = "https://script.google.com/macros/s/AKfycbzTFVn_7u_oGEeijewaNR0t8a5vARJkiuBWpOuMJVcowQdkDdaWGofaar8BRuG88VGGtQ/exec";

      window.galleryState = {
        isUserTouching: false,
        touchStartX: 0,
        touchStartY: 0,
        deltaZ: 0,
        sensitivity: 0.02,
        autoScrollSpeed: 0.015,
        leftTrackMaxSpan: 0,
        rightTrackMaxSpan: 0
      };

      // --- MOBILE TOUCH CONTROLS ---
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.touches[0].clientX;
          window.galleryState.touchStartY = e.touches[0].clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && window.galleryState.isUserTouching) {
          handleInteractionMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      });

      window.addEventListener('touchend', () => {
        window.galleryState.isUserTouching = false;
        window.galleryState.deltaZ = 0;
      });

      // --- LAPTOP RIGHT-CLICK CONTROLS ---
      window.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.clientX;
          window.galleryState.touchStartY = e.clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (window.galleryState.isUserTouching) {
          handleInteractionMove(e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = false;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      function handleInteractionMove(currentX, currentY) {
        let diffX = currentX - window.galleryState.touchStartX;
        let diffY = currentY - window.galleryState.touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
          window.galleryState.deltaZ = diffX;
        } else {
          window.galleryState.deltaZ = -diffY; 
        }

        window.galleryState.touchStartX = currentX;
        window.galleryState.touchStartY = currentY;
      }

      // SMART FLUID CONVEYOR COMPONENT
      AFRAME.registerComponent('conveyor-item', {
        schema: {
          trackSide: { type: 'string', default: 'left' }
        },
        init: function () {
          this.isInitialized = false;
        },
        setupBounds: function(totalSpan) {
          this.minZ = -totalSpan / 2;
          this.maxZ = totalSpan / 2;
          this.totalSpan = totalSpan;
          this.isInitialized = true;
        },
        tick: function () {
          if (!this.isInitialized) {
            let globalSpan = (this.data.trackSide === 'left') ? window.galleryState.leftTrackMaxSpan : window.galleryState.rightTrackMaxSpan;
            if (globalSpan > 0) this.setupBounds(globalSpan);
            return;
          }

          let position = this.el.getAttribute('position');
          let currentZ = position.z;

          if (window.galleryState.isUserTouching) {
            currentZ += window.galleryState.deltaZ * window.galleryState.sensitivity;
          } else {
            currentZ -= window.galleryState.autoScrollSpeed;
          }

          if (currentZ < this.minZ) {
            currentZ += this.totalSpan;
          } else if (currentZ > this.maxZ) {
            currentZ -= this.totalSpan;
          }

          this.el.setAttribute('position', { x: position.x, y: position.y, z: currentZ });
        }
      });

      // LIVE SHEET EXTRACTION & GAPLESS FLUID PACKER
      AFRAME.registerComponent('gallery-loader', {
        init: function () {
          const sceneEl = this.el;
          const assetsEl = document.querySelector('a-assets');
          const startBtn = document.getElementById('startBtn');

          startBtn.disabled = true;
          startBtn.innerText = "Connecting Live Feed...";

          fetch(LIVE_GET_API_URL)
            .then(res => res.json())
            .then(images => {
              if(!images || images.length === 0) {
                document.getElementById('overlay-desc').innerText = "No submitted pictures found in database yet.";
                startBtn.innerText = "Gallery Empty";
                return;
              }

              let leftTrackElements = [];
              let rightTrackElements = [];

              images.forEach((imgData, index) => {
                let imgAsset = document.createElement('img');
                imgAsset.setAttribute('id', `live-img-${index}`);
                imgAsset.setAttribute('src', imgData.src);
                imgAsset.setAttribute('crossorigin', 'anonymous');
                assetsEl.appendChild(imgAsset);

                let aImg = document.createElement('a-image');
                let isLeft = index % 2 === 0;
                
                aImg.setAttribute('src', `#live-img-${index}`);
                aImg.setAttribute('conveyor-item', `trackSide: ${isLeft ? 'left' : 'right'}`);
                
                if (isLeft) {
                  aImg.setAttribute('material', 'side: double');
                  leftTrackElements.push({ item: aImg, asset: imgAsset });
                } else {
                  rightTrackElements.push({ item: aImg, asset: imgAsset });
                }

                sceneEl.appendChild(aImg);
              });

              let processedCount = 0;
              const totalToProcess = images.length;

              function checkProcessingComplete() {
                processedCount++;
                if (processedCount === totalToProcess) {
                  arrangeTrackFluidly(leftTrackElements, '-3', '0 90 0', 'left');
                  arrangeTrackFluidly(rightTrackElements, '3', '0 -90 0', 'right');

                  startBtn.disabled = false;
                  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
                  startBtn.innerText = isMobile ? "Enter Exhibition" : "Start Exhibition";
                }
              }

              [...leftTrackElements, ...rightTrackElements].forEach(obj => {
                if (obj.asset.complete) {
                  calculateTargetDimensions(obj);
                  checkProcessingComplete();
                } else {
                  obj.asset.addEventListener('load', function() {
                    calculateTargetDimensions(obj);
                    checkProcessingComplete();
                  });
                  obj.asset.addEventListener('error', function() {
                    obj.calculatedWidth = 3.2;
                    obj.calculatedHeight = 1.8;
                    checkProcessingComplete();
                  });
                }
              });

              function calculateTargetDimensions(obj) {
                let width = obj.asset.naturalWidth || 16;
                let height = obj.asset.naturalHeight || 9;
                let aspectRatio = width / height;

                let maxBoundaryWidth = 3.2;
                let maxBoundaryHeight = 1.8;

                if (aspectRatio > (maxBoundaryWidth / maxBoundaryHeight)) {
                  obj.calculatedWidth = maxBoundaryWidth;
                  obj.calculatedHeight = maxBoundaryWidth / aspectRatio;
                } else {
                  obj.calculatedHeight = maxBoundaryHeight;
                  obj.calculatedWidth = maxBoundaryHeight * aspectRatio;
                }
                
                obj.item.setAttribute('width', obj.calculatedWidth);
                obj.item.setAttribute('height', obj.calculatedHeight);
              }

              function arrangeTrackFluidly(elementsArray, xPos, rotation, sideName) {
                let currentZAccumulator = 0;
                let marginBetweenFrames = 0.8;

                elementsArray.forEach(obj => {
                  currentZAccumulator += (obj.calculatedWidth / 2);
                  obj.initialZ = currentZAccumulator;
                  currentZAccumulator += (obj.calculatedWidth / 2) + marginBetweenFrames;
                });

                let totalSpan = currentZAccumulator;
                if (sideName === 'left') {
                  window.galleryState.leftTrackMaxSpan = totalSpan;
                } else {
                  window.galleryState.rightTrackMaxSpan = totalSpan;
                }

                elementsArray.forEach(obj => {
                  let centeredZ = obj.initialZ - (totalSpan / 2);
                  obj.item.setAttribute('position', `${xPos} 0 ${centeredZ}`);
                  obj.item.setAttribute('rotation', rotation);
                });
              }
            })
            .catch(err => {
              console.error("Live fetch failed:", err);
              document.getElementById('overlay-desc').innerText = "Error syncing submissions with Google Sheet.";
            });
        }
      });
    </script>
  </head>
  <body>

    <div id="overlay">
      <div id="overlay-content">
        <h2 id="overlay-title">Virtual Exhibition</h2>
        <p id="overlay-desc">Synchronizing with live data panels...</p>
        <button id="startBtn">Enter Exhibition</button>
      </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" embedded renderer="alpha: true; colorManagement: true;" gallery-loader>
      <a-assets>
        </a-assets>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;" position="0 0 0"></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scene = document.querySelector('a-scene');
      
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      if (isMobile) {
        overlayTitle.innerText = "Mobile Exhibition Guide";
        overlayDesc.innerHTML = "• Move your phone to look around the space.<br>• Swipe your finger left/right to scroll the conveyor belt photos manually.<br><br>Camera and motion permissions are required to blend the art with your surroundings.";
      } else {
        overlayTitle.innerText = "Laptop Exhibition Guide";
        overlayDesc.innerHTML = "• <b>Look Around:</b> Click and drag with your <u>Left Mouse Button</u>.<br>• <b>Scroll Photos:</b> Click and hold your <u>Right Mouse Button</u> while dragging your trackpad/mouse left or right.";
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        if (isMobile) {
          navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } 
          })
          .then((stream) => {
            video.srcObject = stream;
            video.play();
          })
          .catch((err) => {
            console.error("Camera connection dropped:", err);
            alert("Could not access the camera background stream. Make sure your setup runs over an HTTPS protocol connection.");
          });
        } else {
          video.style.display = 'none';
          scene.style.backgroundColor = "#1a1a1a";
          
          const cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('look-controls', 'touchEnabled: true');
        }
      });
    </script>
  </body>
</html>

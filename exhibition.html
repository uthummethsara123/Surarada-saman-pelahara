<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Participants Exhibition - Live Stream - Surarada Saman Pelahara</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent !important;
      }

      #webcam-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
        display: none;
      }

      a-scene, .a-canvas {
        background-color: transparent !important;
        background: transparent !important;
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #440613 0%, #540818 100%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .overlay-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      h2 {
        margin: 0 0 10px 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #f59e0b;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      }

      p {
        margin: 0 0 20px 0;
        font-size: 1rem;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.5;
      }

      .mode-btn {
        width: 100%;
        max-width: 380px;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-bottom: 12px;
      }

      .btn-ar {
        background: #f59e0b;
        color: #0f172a;
        border: none;
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.25);
      }

      .btn-ar:hover:not(:disabled) {
        transform: translateY(-2px);
        background: #fbbf24;
        box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
      }

      .btn-ar:disabled {
        background-color: #475569 !important;
        color: #94a3b8 !important;
        cursor: not-allowed;
        box-shadow: none !important;
        opacity: 0.5;
      }

      .btn-basic {
        background: transparent;
        color: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      .btn-basic:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #ffffff;
        transform: translateY(-2px);
      }

      .sub-text {
        font-size: 11px;
        font-weight: normal;
        text-transform: none;
        opacity: 0.85;
        letter-spacing: 0;
      }
    </style>

    <script>
      const LIVE_GET_API_URL = "https://script.google.com/macros/s/AKfycbzTFVn_7u_oGEeijewaNR0t8a5vARJkiuBWpOuMJVcowQdkDdaWGofaar8BRuG88VGGtQ/exec";

      window.galleryState = {
        isUserTouching: false,
        touchStartX: 0,
        touchStartY: 0,
        deltaZ: 0,
        sensitivity: 0.02,
        autoScrollSpeed: 0.015,
        leftTrackMaxSpan: 0,
        rightTrackMaxSpan: 0,
        isBtnScrolling: false,
        btnScrollDir: 0,
        btnScrollSpeedMultiplier: 1.0
      };

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.touches[0].clientX;
          window.galleryState.touchStartY = e.touches[0].clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && window.galleryState.isUserTouching) {
          handleInteractionMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      });

      window.addEventListener('touchend', () => {
        window.galleryState.isUserTouching = false;
        window.galleryState.deltaZ = 0;
      });

      window.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.clientX;
          window.galleryState.touchStartY = e.clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (window.galleryState.isUserTouching) {
          handleInteractionMove(e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = false;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      function handleInteractionMove(currentX, currentY) {
        let diffX = currentX - window.galleryState.touchStartX;
        let diffY = currentY - window.galleryState.touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
          window.galleryState.deltaZ = diffX;
        } else {
          window.galleryState.deltaZ = -diffY; 
        }

        window.galleryState.touchStartX = currentX;
        window.galleryState.touchStartY = currentY;
      }

      AFRAME.registerComponent('conveyor-item', {
        schema: {
          trackSide: { type: 'string', default: 'left' }
        },
        init: function () {
          this.isInitialized = false;
        },
        setupBounds: function(totalSpan) {
          this.minZ = -totalSpan / 2;
          this.maxZ = totalSpan / 2;
          this.totalSpan = totalSpan;
          this.isInitialized = true;
        },
        tick: function () {
          if (!this.isInitialized) {
            let globalSpan = (this.data.trackSide === 'left') ? window.galleryState.leftTrackMaxSpan : window.galleryState.rightTrackMaxSpan;
            if (globalSpan > 0) this.setupBounds(globalSpan);
            return;
          }

          let position = this.el.getAttribute('position');
          let currentZ = position.z;

          if (window.galleryState.isBtnScrolling) {
            currentZ += window.galleryState.btnScrollDir * 0.05 * window.galleryState.btnScrollSpeedMultiplier; 
          } else if (window.galleryState.isUserTouching) {
            currentZ += window.galleryState.deltaZ * window.galleryState.sensitivity;
          } else {
            currentZ -= window.galleryState.autoScrollSpeed;
          }

          if (currentZ < this.minZ) {
            currentZ += this.totalSpan;
          } else if (currentZ > this.maxZ) {
            currentZ -= this.totalSpan;
          }

          this.el.setAttribute('position', { x: position.x, y: position.y, z: currentZ });
        }
      });

      AFRAME.registerComponent('gallery-loader', {
        init: function () {
          const sceneEl = this.el;
          const assetsEl = document.querySelector('a-assets');
          const connectionStatus = document.getElementById('connection-status');
          const modeSelectionArea = document.getElementById('mode-selection-area');

          sceneEl.addEventListener('render-target-loaded', () => {
            if (sceneEl.renderer) {
              sceneEl.renderer.setClearColor(0x000000, 0);
              sceneEl.renderer.alpha = true;
            }
          });

          connectionStatus.innerText = "Connecting Live Feed...";

          fetch(LIVE_GET_API_URL)
            .then(res => res.json())
            .then(images => {
              if(!images || images.length === 0) {
                document.getElementById('overlay-desc').innerText = "No submitted pictures found in database yet.";
                connectionStatus.innerText = "Gallery Empty";
                return;
              }

              let leftTrackElements = [];
              let rightTrackElements = [];

              images.forEach((imgData, index) => {
                let imgAsset = document.createElement('img');
                imgAsset.setAttribute('id', `live-img-${index}`);
                imgAsset.setAttribute('src', imgData.src);
                imgAsset.setAttribute('crossorigin', 'anonymous');
                assetsEl.appendChild(imgAsset);

                let aImg = document.createElement('a-image');
                let isLeft = index % 2 === 0;
                
                aImg.setAttribute('src', `#live-img-${index}`);
                aImg.setAttribute('conveyor-item', `trackSide: ${isLeft ? 'left' : 'right'}`);
                
                if (isLeft) {
                  aImg.setAttribute('material', 'side: double');
                  leftTrackElements.push({ item: aImg, asset: imgAsset });
                } else {
                  rightTrackElements.push({ item: aImg, asset: imgAsset });
                }

                sceneEl.appendChild(aImg);
              });

              let processedCount = 0;
              const totalToProcess = images.length;

              function checkProcessingComplete() {
                processedCount++;
                if (processedCount === totalToProcess) {
                  arrangeTrackFluidly(leftTrackElements, '-3', '0 90 0', 'left');
                  arrangeTrackFluidly(rightTrackElements, '3', '0 -90 0', 'right');

                  connectionStatus.style.display = "none";
                  modeSelectionArea.style.display = "block";
                  
                  checkHardwareGyroscope();
                }
              }

              [...leftTrackElements, ...rightTrackElements].forEach(obj => {
                if (obj.asset.complete) {
                  calculateTargetDimensions(obj);
                  checkProcessingComplete();
                } else {
                  obj.asset.addEventListener('load', function() {
                    calculateTargetDimensions(obj);
                    checkProcessingComplete();
                  });
                  obj.asset.addEventListener('error', function() {
                    obj.calculatedWidth = 3.2;
                    obj.calculatedHeight = 1.8;
                    checkProcessingComplete();
                  });
                }
              });

              function calculateTargetDimensions(obj) {
                let width = obj.asset.naturalWidth || 16;
                let height = obj.asset.naturalHeight || 9;
                let aspectRatio = width / height;

                let maxBoundaryWidth = 3.2;
                let maxBoundaryHeight = 1.8;

                if (aspectRatio > (maxBoundaryWidth / maxBoundaryHeight)) {
                  obj.calculatedWidth = maxBoundaryWidth;
                  obj.calculatedHeight = maxBoundaryWidth / aspectRatio;
                } else {
                  obj.calculatedHeight = maxBoundaryHeight;
                  obj.calculatedWidth = maxBoundaryHeight * aspectRatio;
                }
                
                obj.item.setAttribute('width', obj.calculatedWidth);
                obj.item.setAttribute('height', obj.calculatedHeight);
              }

              function arrangeTrackFluidly(elementsArray, xPos, rotation, sideName) {
                let currentZAccumulator = 0;
                let marginBetweenFrames = 0.8;

                elementsArray.forEach(obj => {
                  currentZAccumulator += (obj.calculatedWidth / 2);
                  obj.initialZ = currentZAccumulator;
                  currentZAccumulator += (obj.calculatedWidth / 2) + marginBetweenFrames;
                });

                let totalSpan = currentZAccumulator;
                if (sideName === 'left') {
                  window.galleryState.leftTrackMaxSpan = totalSpan;
                } else {
                  window.galleryState.rightTrackMaxSpan = totalSpan;
                }

                elementsArray.forEach(obj => {
                  let centeredZ = obj.initialZ - (totalSpan / 2);
                  obj.item.setAttribute('position', `${xPos} 0 ${centeredZ}`);
                  obj.item.setAttribute('rotation', rotation);
                });
              }
            })
            .catch(err => {
              console.error("Live fetch failed:", err);
              document.getElementById('connection-status').innerText = "Error syncing submissions with Google Sheet.";
            });
        }
      });
    </script>
  </head>

    <script>
      document.documentElement.classList.add('lock-scrolling');
      document.body.classList.add('lock-scrolling');
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";

      const forceUnlockTimeout = setTimeout(() => {
          cleanUpAndDestroyLoader("Safety Timeout Triggered");
      }, 3500);

      function cleanUpAndDestroyLoader(reason) {
          console.log("Loader Dismissed via:", reason);
          const loader = document.getElementById("loader");
          if (loader) {
              loader.style.display = "none";
          }
          document.documentElement.classList.remove('lock-scrolling');
          document.body.classList.remove('lock-scrolling');
          document.documentElement.style.overflow = "auto";
          document.body.style.overflow = "auto";
      }

      window.addEventListener("load", () => {
          clearTimeout(forceUnlockTimeout);
          setTimeout(() => {
              cleanUpAndDestroyLoader("Standard Window Load Event");
          }, 1200);
      });

      const nativeVideo = document.getElementById('webcam-video');
      const overlay = document.getElementById('overlay');
      const scene = document.querySelector('a-scene');
      const mainCamera = document.getElementById('main-camera');
      
      const selectArBtn = document.getElementById('select-ar-btn');
      const selectBasicBtn = document.getElementById('select-basic-btn');
      const specsWarningBox = document.getElementById('specs-warning-box');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      function checkHardwareGyroscope() {
        if (!isMobile) return;
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          return;
        }

        let gyroDetected = false;
        function sensorTest(event) {
          if (event.alpha !== null || event.beta !== null || event.gamma !== null) {
            gyroDetected = true;
          }
          window.removeEventListener('deviceorientation', sensorTest);
        }
        window.addEventListener('deviceorientation', sensorTest);

        setTimeout(() => {
          if (!gyroDetected) {
            selectArBtn.disabled = true;
            specsWarningBox.style.display = "block";
          }
        }, 600);
      }

      const forceSceneClearTransparency = () => {
        if (scene) {
          scene.style.backgroundColor = "transparent";
          scene.style.background = "transparent";
        }
        document.querySelectorAll('.a-canvas').forEach(canvas => {
          canvas.style.backgroundColor = "transparent";
          canvas.style.background = "transparent";
        });
        if (scene && scene.renderer) {
          scene.renderer.setClearColor(0x000000, 0);
        }
      };

      function activateMobilePermissions() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().catch(console.error);
        }

        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
        })
        .then((stream) => {
          nativeVideo.srcObject = stream;
          nativeVideo.addEventListener('playing', () => {
            forceSceneClearTransparency();
            nativeVideo.style.display = "block";
          }, { once: true });
          nativeVideo.play().catch(e => console.log(e));
        })
        .catch((err) => {
          console.error("Camera access denied:", err);
          if (scene) scene.style.backgroundColor = "#1a1a1a";
        });
      }

      function revealControlPods() {
        const leftGroup = document.getElementById('left-controls-group');
        const rightGroup = document.getElementById('right-controls-group');
        if (leftGroup) leftGroup.setAttribute('visible', 'true');
        if (rightGroup) rightGroup.setAttribute('visible', 'true');
      }

      selectArBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        if (isMobile) {
          mainCamera.setAttribute('look-controls', 'magicWindowTrackingEnabled: true; touchEnabled: false;');
          forceSceneClearTransparency();
          activateMobilePermissions();
        } else {
          revealControlPods();
          if (scene) scene.style.backgroundColor = "#1a1a1a";
          mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
        }
      });

      selectBasicBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        revealControlPods();

        if (isMobile) {
          mainCamera.setAttribute('look-controls', 'magicWindowTrackingEnabled: false; touchEnabled: true;');
          if (nativeVideo) nativeVideo.style.display = "none";
          if (scene) scene.style.backgroundColor = "#1a1a1a";
        } else {
          if (scene) scene.style.backgroundColor = "#1a1a1a";
          mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const logoBtn = document.getElementById('winners-logo-btn');
        const logoTooltip = document.getElementById('logo-tooltip');

        if (!isMobile) {
          if (selectArBtn && selectBasicBtn) {
            const buttonContainer = selectArBtn.parentElement;
            if (buttonContainer) {
              buttonContainer.innerHTML = `
                <button id="laptop-enter-btn" class="mode-btn btn-ar" style="width: 100%; max-width: 280px; margin: 0 auto;">
                  <span>Enter Exhibition</span>
                </button>
              `;
              
              document.getElementById('laptop-enter-btn').addEventListener('click', () => {
                overlay.style.display = 'none';
                revealControlPods();
                if (scene) scene.style.backgroundColor = "#1a1a1a";
                mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
              });
            }
          }
        } else {
          checkHardwareGyroscope();
        }

        function registerPodButton(id, directionalFlag, speedMultiplier) {
          const buttonEl = document.getElementById(id);
          if (!buttonEl) return;

          const startScrolling = () => {
            window.galleryState.isBtnScrolling = true;
            window.galleryState.btnScrollDir = directionalFlag;
            window.galleryState.btnScrollSpeedMultiplier = speedMultiplier;
          };

          const stopScrolling = () => {
            window.galleryState.isBtnScrolling = false;
          };

          buttonEl.addEventListener('mousedown', startScrolling);
          buttonEl.addEventListener('mouseup', stopScrolling);
          buttonEl.addEventListener('mouseleave', stopScrolling);

          buttonEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startScrolling();
          });
          buttonEl.addEventListener('touchend', stopScrolling);
        }

        // Left Pod Action Listeners Mapping
        registerPodButton('btn-left-ff', 1, 3.5);          
        registerPodButton('btn-left-normal-left', 1, 1.0);  
        registerPodButton('btn-left-normal-right', -1, 1.0); 
        registerPodButton('btn-left-rw', -1, 3.5);          

        // Right Pod Action Listeners Mapping
        registerPodButton('btn-right-ff', 1, 3.5);          
        registerPodButton('btn-right-normal-left', 1, 1.0);  
        registerPodButton('btn-right-normal-right', -1, 1.0); 
        registerPodButton('btn-right-rw', -1, 3.5);          

        // Restored Original Transparent White Background Textures map
        if (logoTooltip) {
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 512; // Increased height to ensure no lines are cut off
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          // Clean transparent white background plate layout
          ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          // Line 1: Upward Arrow Caret (Top Line)
          ctx.fillStyle = '#f59e0b'; 
          ctx.font = 'bold 90px monospace';
          ctx.fillText('^', canvas.width / 2, 90);
          
          // Line 2: View Winners Header (Middle Line)
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 72px monospace';
          ctx.fillText('VIEW WINNERS', canvas.width / 2, 240);
          
          // Line 3: Double Tap Guideline (Bottom Line)
          ctx.fillStyle = '#ffffff'; 
          ctx.font = 'bold 50px monospace';
          ctx.fillText('DOUBLE TAP TO GO', canvas.width / 2, 390);
          
          // Set the canvas texture to the plane material
          logoTooltip.setAttribute('material', {
            src: canvas,
            shader: 'flat',
            transparent: true,
            side: 'double'
          });

          // Force WebGL component texture updates
          logoTooltip.addEventListener('materialtextureloaded', () => {
            const mesh = logoTooltip.getObject3D('mesh');
            if (mesh && mesh.material && mesh.material.map) {
              mesh.material.map.needsUpdate = true;
            }
          });
        }

        if (logoBtn) {
          let lastClickTime = 0;

          logoBtn.addEventListener('mouseenter', () => {
            logoBtn.setAttribute('material', 'color', '#ffeaa7'); 
            if (logoTooltip) logoTooltip.setAttribute('visible', 'true');
          });
          logoBtn.addEventListener('mouseleave', () => {
            logoBtn.setAttribute('material', 'color', '#ffffff');
            if (logoTooltip) logoTooltip.setAttribute('visible', 'false');
          });
          
          logoBtn.addEventListener('click', () => {
            const currentTime = Date.now();
            const clickDelay = currentTime - lastClickTime;
            
            if (clickDelay > 0 && clickDelay < 350) {
              window.location.href = 'winners-exhibition.html';
            }
            lastClickTime = currentTime;
          });
        }
      });
    </script>
  </body>
</html>

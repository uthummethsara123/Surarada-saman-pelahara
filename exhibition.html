<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Virtual Exhibition - Live Stream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent !important;
      }

      /* Native hardware camera stream positioned perfectly flat in the background */
      #webcam-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
        display: none;
      }

      /* Forces WebGL canvases to remain transparent */
      a-scene, .a-canvas {
        background-color: transparent !important;
        background: transparent !important;
      }

      /* Styled Grand Entrance Panel */
      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #440613 0%, #540818 100%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .overlay-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      h2 {
        margin: 0 0 10px 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #f59e0b;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      }

      p {
        margin: 0 0 30px 0;
        font-size: 1rem;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.5;
      }

      .start-btn {
        background: #f59e0b;
        color: #0f172a;
        border: none;
        padding: 14px 36px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .start-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(245, 158, 11, 0.5);
        background: #fbbf24;
      }

      .start-btn:disabled {
        background-color: #475569;
        color: #94a3b8;
        cursor: not-allowed;
        box-shadow: none;
      }
    </style>

    <script>
      const LIVE_GET_API_URL = "https://script.google.com/macros/s/AKfycbzTFVn_7u_oGEeijewaNR0t8a5vARJkiuBWpOuMJVcowQdkDdaWGofaar8BRuG88VGGtQ/exec";

      window.galleryState = {
        isUserTouching: false,
        touchStartX: 0,
        touchStartY: 0,
        deltaZ: 0,
        sensitivity: 0.02,
        autoScrollSpeed: 0.015,
        leftTrackMaxSpan: 0,
        rightTrackMaxSpan: 0
      };

      // --- TOUCH CONTROLS ---
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.touches[0].clientX;
          window.galleryState.touchStartY = e.touches[0].clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && window.galleryState.isUserTouching) {
          handleInteractionMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      });

      window.addEventListener('touchend', () => {
        window.galleryState.isUserTouching = false;
        window.galleryState.deltaZ = 0;
      });

      // --- MOUSE CONTROLS ---
      window.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.clientX;
          window.galleryState.touchStartY = e.clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (window.galleryState.isUserTouching) {
          handleInteractionMove(e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = false;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      function handleInteractionMove(currentX, currentY) {
        let diffX = currentX - window.galleryState.touchStartX;
        let diffY = currentY - window.galleryState.touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
          window.galleryState.deltaZ = diffX;
        } else {
          window.galleryState.deltaZ = -diffY; 
        }

        window.galleryState.touchStartX = currentX;
        window.galleryState.touchStartY = currentY;
      }

      // SMART FLUID CONVEYOR COMPONENT
      AFRAME.registerComponent('conveyor-item', {
        schema: {
          trackSide: { type: 'string', default: 'left' }
        },
        init: function () {
          this.isInitialized = false;
        },
        setupBounds: function(totalSpan) {
          this.minZ = -totalSpan / 2;
          this.maxZ = totalSpan / 2;
          this.totalSpan = totalSpan;
          this.isInitialized = true;
        },
        tick: function () {
          if (!this.isInitialized) {
            let globalSpan = (this.data.trackSide === 'left') ? window.galleryState.leftTrackMaxSpan : window.galleryState.rightTrackMaxSpan;
            if (globalSpan > 0) this.setupBounds(globalSpan);
            return;
          }

          let position = this.el.getAttribute('position');
          let currentZ = position.z;

          if (window.galleryState.isUserTouching) {
            currentZ += window.galleryState.deltaZ * window.galleryState.sensitivity;
          } else {
            currentZ -= window.galleryState.autoScrollSpeed;
          }

          if (currentZ < this.minZ) {
            currentZ += this.totalSpan;
          } else if (currentZ > this.maxZ) {
            currentZ -= this.totalSpan;
          }

          this.el.setAttribute('position', { x: position.x, y: position.y, z: currentZ });
        }
      });

      // LIVE SHEET EXTRACTION & GAPLESS FLUID PACKER
      AFRAME.registerComponent('gallery-loader', {
        init: function () {
          const sceneEl = this.el;
          const assetsEl = document.querySelector('a-assets');
          const startBtn = document.getElementById('startBtn');

          sceneEl.addEventListener('render-target-loaded', () => {
            if (sceneEl.renderer) {
              sceneEl.renderer.setClearColor(0x000000, 0);
              sceneEl.renderer.alpha = true;
            }
          });

          startBtn.disabled = true;
          startBtn.innerText = "Connecting Live Feed...";

          fetch(LIVE_GET_API_URL)
            .then(res => res.json())
            .then(images => {
              if(!images || images.length === 0) {
                document.getElementById('overlay-desc').innerText = "No submitted pictures found in database yet.";
                startBtn.innerText = "Gallery Empty";
                return;
              }

              let leftTrackElements = [];
              let rightTrackElements = [];

              images.forEach((imgData, index) => {
                let imgAsset = document.createElement('img');
                imgAsset.setAttribute('id', `live-img-${index}`);
                imgAsset.setAttribute('src', imgData.src);
                imgAsset.setAttribute('crossorigin', 'anonymous');
                assetsEl.appendChild(imgAsset);

                let aImg = document.createElement('a-image');
                let isLeft = index % 2 === 0;
                
                aImg.setAttribute('src', `#live-img-${index}`);
                aImg.setAttribute('conveyor-item', `trackSide: ${isLeft ? 'left' : 'right'}`);
                
                if (isLeft) {
                  aImg.setAttribute('material', 'side: double');
                  leftTrackElements.push({ item: aImg, asset: imgAsset });
                } else {
                  rightTrackElements.push({ item: aImg, asset: imgAsset });
                }

                sceneEl.appendChild(aImg);
              });

              let processedCount = 0;
              const totalToProcess = images.length;

              function checkProcessingComplete() {
                processedCount++;
                if (processedCount === totalToProcess) {
                  arrangeTrackFluidly(leftTrackElements, '-3', '0 90 0', 'left');
                  arrangeTrackFluidly(rightTrackElements, '3', '0 -90 0', 'right');

                  startBtn.disabled = false;
                  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
                  startBtn.innerText = isMobile ? "Enter Exhibition" : "Start Exhibition";
                }
              }

              [...leftTrackElements, ...rightTrackElements].forEach(obj => {
                if (obj.asset.complete) {
                  calculateTargetDimensions(obj);
                  checkProcessingComplete();
                } else {
                  obj.asset.addEventListener('load', function() {
                    calculateTargetDimensions(obj);
                    checkProcessingComplete();
                  });
                  obj.asset.addEventListener('error', function() {
                    obj.calculatedWidth = 3.2;
                    obj.calculatedHeight = 1.8;
                    checkProcessingComplete();
                  });
                }
              });

              function calculateTargetDimensions(obj) {
                let width = obj.asset.naturalWidth || 16;
                let height = obj.asset.naturalHeight || 9;
                let aspectRatio = width / height;

                let maxBoundaryWidth = 3.2;
                let maxBoundaryHeight = 1.8;

                if (aspectRatio > (maxBoundaryWidth / maxBoundaryHeight)) {
                  obj.calculatedWidth = maxBoundaryWidth;
                  obj.calculatedHeight = maxBoundaryWidth / aspectRatio;
                } else {
                  obj.calculatedHeight = maxBoundaryHeight;
                  obj.calculatedWidth = maxBoundaryHeight * aspectRatio;
                }
                
                obj.item.setAttribute('width', obj.calculatedWidth);
                obj.item.setAttribute('height', obj.calculatedHeight);
              }

              function arrangeTrackFluidly(elementsArray, xPos, rotation, sideName) {
                let currentZAccumulator = 0;
                let marginBetweenFrames = 0.8;

                elementsArray.forEach(obj => {
                  currentZAccumulator += (obj.calculatedWidth / 2);
                  obj.initialZ = currentZAccumulator;
                  currentZAccumulator += (obj.calculatedWidth / 2) + marginBetweenFrames;
                });

                let totalSpan = currentZAccumulator;
                if (sideName === 'left') {
                  window.galleryState.leftTrackMaxSpan = totalSpan;
                } else {
                  window.galleryState.rightTrackMaxSpan = totalSpan;
                }

                elementsArray.forEach(obj => {
                  let centeredZ = obj.initialZ - (totalSpan / 2);
                  obj.item.setAttribute('position', `${xPos} 0 ${centeredZ}`);
                  obj.item.setAttribute('rotation', rotation);
                });
              }
            })
            .catch(err => {
              console.error("Live fetch failed:", err);
              document.getElementById('overlay-desc').innerText = "Error syncing submissions with Google Sheet.";
            });
        }
      });
    </script>
  </head>
  <body>

    <div id="overlay">
      <img src="/assets/img/logo.png" alt="Logo" class="overlay-logo" />
      <h2 id="overlay-title">Virtual Exhibition</h2>
      <p id="overlay-desc">Synchronizing with live data panels...</p>
      <button id="startBtn" class="start-btn">Enter Exhibition</button>
    </div>

    <video id="webcam-video" autoplay playsinline muted loop></video>


<a-scene vr-mode-ui="enabled: false" embedded renderer="alpha: true; colorManagement: true;" gallery-loader cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <a-assets>
        <img id="logo-img" src="assets/img/logo.png" crossorigin="anonymous">
      </a-assets>

      <a-image id="winners-logo-btn" class="clickable" src="#logo-img" position="0 0.15 -2" width="1.5" height="1.2" material="side: double; transparent: true;"
               animation="property: scale; to: 1.08 1.08 1.08; dir: alternate; dur: 1500; loop: true; easing: easeInOutQuad">
      </a-image>

      <a-plane id="logo-tooltip" width="1.4" height="0.45" position="0 -0.85 -2" visible="false"
               material="shader: flat; transparent: true; side: double;"></a-plane>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;" position="0 0 0"></a-entity>
    </a-scene>
    
    <script>
      const nativeVideo = document.getElementById('webcam-video');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scene = document.querySelector('a-scene');
      
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      const forceSceneClearTransparency = () => {
        if (scene) {
          scene.style.backgroundColor = "transparent";
          scene.style.background = "transparent";
        }
        document.querySelectorAll('.a-canvas').forEach(canvas => {
          canvas.style.backgroundColor = "transparent";
          canvas.style.background = "transparent";
        });
        if (scene && scene.renderer) {
          scene.renderer.setClearColor(0x000000, 0);
        }
      };

      if (isMobile) {
        overlayTitle.innerText = "Mobile Exhibition Guide";
        overlayDesc.innerHTML = "• Move your phone to look around the space.<br>• Swipe your finger left/right to scroll the conveyor belt photos manually.<br><br>Camera and motion permissions are required to blend the art with your surroundings.";
      } else {
        overlayTitle.innerText = "Laptop Exhibition Guide";
        overlayDesc.innerHTML = "• <b>Look Around:</b> Click and drag with your <u>Left Mouse Button</u>.<br>• <b>Scroll Photos:</b> Click and hold your <u>Right Mouse Button</u> while dragging your trackpad/mouse left or right.";
      }

      function activateMobilePermissions() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().catch(console.error);
        }

        navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          } 
        })
        .then((stream) => {
          nativeVideo.srcObject = stream;
          
          nativeVideo.addEventListener('playing', () => {
            forceSceneClearTransparency();
            nativeVideo.style.display = "block";
          }, { once: true });

          nativeVideo.play().catch(e => console.log(e));
        })
        .catch((err) => {
          console.error("Camera access denied:", err);
          alert("Camera initialization failed. Please verify browser options.");
        });
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        if (isMobile) {
          forceSceneClearTransparency();
          activateMobilePermissions();
        } else {
          if (scene) scene.style.backgroundColor = "#1a1a1a";
          const cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('look-controls', 'touchEnabled: true');
        }
      });


      // Click interaction, gold glow transition, and canvas tooltip system
      document.addEventListener('DOMContentLoaded', () => {
        const logoBtn = document.getElementById('winners-logo-btn');
        const logoTooltip = document.getElementById('logo-tooltip');

        if (logoTooltip) {
          // Larger high-resolution texture canvas space
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');
          
          // Clear any previous frames
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          // 1. Draw Transparent White Tooltip Background Box
          ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          // 2. Draw Bright Solid Gold Text Layer (100% full opacity)
          ctx.fillStyle = '#f59e0b'; 
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          // Draw Much Larger Up Arrow
          ctx.font = 'bold 80px monospace';
          ctx.fillText('↑', canvas.width / 2, 70);
          
          // Draw Much Larger Main Text Label
          ctx.font = 'bold 64px monospace';
          ctx.fillText('VIEW WINNERS', canvas.width / 2, 180);
          
          // Bind the high-res texture canvas straight into the component system
          logoTooltip.setAttribute('material', 'src', canvas);
        }

        if (logoBtn) {
          // Trigger look/hover response rules
          logoBtn.addEventListener('mouseenter', () => {
            // Adds a light-gold color tint modification layer
            logoBtn.setAttribute('material', 'color', '#ffeaa7'); 
            if (logoTooltip) logoTooltip.setAttribute('visible', 'true');
          });

          // Reset element parameters when looking away
          logoBtn.addEventListener('mouseleave', () => {
            logoBtn.setAttribute('material', 'color', '#ffffff');
            if (logoTooltip) logoTooltip.setAttribute('visible', 'false');
          });

          // Redirect to target file path on tap/click activation
          logoBtn.addEventListener('click', () => {
            window.location.href = 'winners-exhibition.html';
          });
        }
      });

    </script>
  </body>
</html>

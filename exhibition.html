<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Exhibition</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121212;
      }

      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      /* Splash screen to trigger browser permissions */
      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      #overlay-content {
        max-width: 400px;
      }

      #startBtn {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>

    <script>
      // Custom component attached to the RIG to handle bounded finger swipe panning
      AFRAME.registerComponent('bounded-rig-touch', {
        init: function () {
          this.touchStartX = 0;
          this.currentYaw = 0;
          this.sensitivity = 0.3; // Responsive touch speed
          this.yawLimit = 45;     // Limits swiping to 45 degrees left or right

          window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
              this.touchStartX = e.touches[0].clientX;
            }
          });

          window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
              let deltaX = e.touches[0].clientX - this.touchStartX;
              this.touchStartX = e.touches[0].clientX;

              // Calculate new swipe angle
              this.currentYaw += deltaX * this.sensitivity;
              
              // Hard clamp the touch dragging so it cannot rotate 360 degrees
              this.currentYaw = Math.max(-this.yawLimit, Math.min(this.yawLimit, this.currentYaw));
              
              // Apply the restricted rotation directly to the camera rig parent
              this.el.setAttribute('rotation', {
                x: 0,
                y: this.currentYaw,
                z: 0
              });
            }
          });
        }
      });
    </script>
  </head>
  <body>

    <div id="overlay">
      <div id="overlay-content">
        <h2 id="overlay-title">Virtual Exhibition</h2>
        <p id="overlay-desc">This experience requires camera access to overlay the artworks.</p>
        <button id="startBtn">Enter Exhibition</button>
      </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" embedded style="background: transparent;">
      <a-assets>
        <img id="img1" src="/assets/img/2025/c 1.jpg" crossorigin="anonymous">
        <img id="img2" src="/assets/img/2025/c 2.jpg" crossorigin="anonymous">
      </a-assets>

      <a-image src="#img1" position="-3 0 0" rotation="0 90 0" width="3.5" height="2"></a-image>
      <a-image src="#img2" position="3 0 0" rotation="0 -90 0" width="3.5" height="2"></a-image>

      <a-entity id="camera-rig" bounded-rig-touch>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scene = document.querySelector('a-scene');
      
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      if (!isMobile) {
        overlayTitle.innerText = "Mobile Phone Recommended";
        overlayDesc.innerHTML = "For the best experience, please open this link on your mobile phone to look around using your device camera.<br><br>You can still enter on desktop by dragging your mouse to look around.";
        startBtn.innerText = "Continue anyway";
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        if (isMobile) {
          navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } 
          })
          .then((stream) => {
            video.srcObject = stream;
            video.play();
          })
          .catch((err) => {
            console.error("Camera error:", err);
            alert("Could not access camera. Please check permissions or run via HTTPS.");
          });
        } else {
          video.style.display = 'none';
          scene.style.backgroundColor = "#1a1a1a";
          
          // Fallback: If desktop, re-enable standard touch/mouse dragging for testing
          const cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('look-controls', 'touchEnabled: true');
        }
      });
    </script>
  </body>
</html>

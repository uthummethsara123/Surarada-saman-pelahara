<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Exhibition</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121212;
      }

      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      #overlay-content {
        max-width: 400px;
      }

      #startBtn {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>

    <script>
      // Custom component that safely handles finger swipe offsets on the outer rig
      AFRAME.registerComponent('bounded-touch-pan', {
        init: function () {
          this.touchStartX = 0;
          this.touchYawOffset = 0;
          this.sensitivity = 0.4; // Responsive pan speed
          this.yawLimit = 45;      // Restricts local swipe panning limits 

          window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
              this.touchStartX = e.touches[0].clientX;
            }
          });

          window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
              let deltaX = e.touches[0].clientX - this.touchStartX;
              this.touchStartX = e.touches[0].clientX;

              this.touchYawOffset += deltaX * this.sensitivity;
              
              // Hard limit local touch dragging so it doesn't spin freely
              this.touchYawOffset = Math.max(-this.yawLimit, Math.min(this.yawLimit, this.touchYawOffset));
              
              // Update the Rig's rotation, leaving the internal camera free to track 360
              this.el.setAttribute('rotation', {
                x: 0,
                y: this.touchYawOffset,
                z: 0
              });
            }
          });
        }
      });
    </script>
  </head>
  <body>

    <div id="overlay">
      <div id="overlay-content">
        <h2 id="overlay-title">Virtual Exhibition</h2>
        <p id="overlay-desc">This experience requires camera access to overlay the artworks.</p>
        <button id="startBtn">Enter Exhibition</button>
      </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" embedded style="background: transparent;">
      <a-assets>
        <img id="imgL1" src="/assets/img/2025/c 1.jpg" crossorigin="anonymous">
        <img id="imgL2" src="/assets/img/2025/c 2.jpg" crossorigin="anonymous">
        <img id="imgL3" src="/assets/img/2025/c 3.jpg" crossorigin="anonymous">
        <img id="imgL4" src="/assets/img/2025/c merit (2).jpg" crossorigin="anonymous">
        
        <img id="imgR1" src="/assets/img/2025/m 1.jpg" crossorigin="anonymous">
        <img id="imgR2" src="/assets/img/2025/m 2.jpg" crossorigin="anonymous">
        <img id="imgR3" src="/assets/img/2025/m 3.jpg" crossorigin="anonymous">
        <img id="imgR4" src="/assets/img/2025/m merit (2).jpg" crossorigin="anonymous">
      </a-assets>

      <a-image src="#imgL1" position="-3 0  3" rotation="0 90 0" width="2" height="1.5"></a-image>
      <a-image src="#imgL2" position="-3 0  1" rotation="0 90 0" width="2" height="1.5"></a-image>
      <a-image src="#imgL3" position="-3 0 -1" rotation="0 90 0" width="2" height="1.5"></a-image>
      <a-image src="#imgL4" position="-3 0 -3" rotation="0 90 0" width="2" height="1.5"></a-image>

      <a-image src="#imgR1" position="3 0  3" rotation="0 -90 0" width="2" height="1.5"></a-image>
      <a-image src="#imgR2" position="3 0  1" rotation="0 -90 0" width="2" height="1.5"></a-image>
      <a-image src="#imgR3" position="3 0 -1" rotation="0 -90 0" width="2" height="1.5"></a-image>
      <a-image src="#imgR4" position="3 0 -3" rotation="0 -90 0" width="2" height="1.5"></a-image>

      <a-entity id="camera-rig" bounded-touch-pan>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scene = document.querySelector('a-scene');
      
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      if (!isMobile) {
        overlayTitle.innerText = "Mobile Phone Recommended";
        overlayDesc.innerHTML = "For the best experience, please open this link on your mobile phone to look around using your device camera.<br><br>You can still enter on desktop by dragging your mouse to look around.";
        startBtn.innerText = "Continue anyway";
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        if (isMobile) {
          navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } 
          })
          .then((stream) => {
            video.srcObject = stream;
            video.play();
          })
          .catch((err) => {
            console.error("Camera error:", err);
            alert("Could not access camera. Please check permissions or run via HTTPS.");
          });
        } else {
          video.style.display = 'none';
          scene.style.backgroundColor = "#1a1a1a";
          
          // Fallback touch controls for desktop mouse testing
          const cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('look-controls', 'touchEnabled: true');
        }
      });
    </script>
  </body>
</html>

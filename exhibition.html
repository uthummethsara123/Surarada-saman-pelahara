<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Participants Exhibition - Live Stream - Surarada Saman Pelahara</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
     html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #3a0510 !important;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif !important;
      }

      h2, h3, h4, p, span, button, div {
        font-family: 'Poppins', system-ui, -apple-system, sans-serif !important;
      }

      a-scene, .a-canvas {
        background-color: #3a0510 !important;
        background: #3a0510 !important;
      }

      #overlay {
        position: fixed;
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%;
        background: linear-gradient(135deg, #440613 0%, #540818 100%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        justify-content: safe center; 
        align-items: center;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 30px 20px; 
        box-sizing: border-box;
        overflow-y: auto; 
        -webkit-overflow-scrolling: touch; 
      }

      .overlay-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      h2 {
        margin: 0 0 10px 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #f59e0b;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      }

      p {
        margin: 0 0 20px 0;
        font-size: 1rem;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.5;
      }

      .mode-btn {
        width: 100%;
        max-width: 380px;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-bottom: 12px;
      }

      .btn-ar {
        background: #f59e0b;
        color: #0f172a;
        border: none;
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.25);
      }

      .btn-ar:hover:not(:disabled) {
        transform: translateY(-2px);
        background: #fbbf24;
        box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
      }

      .btn-ar:disabled {
        background-color: #475569 !important;
        color: #94a3b8 !important;
        cursor: not-allowed;
        box-shadow: none !important;
        opacity: 0.5;
      }

      .btn-basic {
        background: transparent;
        color: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      .btn-basic:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #ffffff;
        transform: translateY(-2px);
      }

      .sub-text {
        font-size: 11px;
        font-weight: normal;
        text-transform: none;
        opacity: 0.85;
        letter-spacing: 0;
      }

      #info-btn:hover {
        background: #f59e0b !important;
        color: #480714 !important;
        transform: scale(1.08);
      }
    </style>

    <script>
      const LIVE_GET_API_URL = "https://script.google.com/macros/s/AKfycbzTFVn_7u_oGEeijewaNR0t8a5vARJkiuBWpOuMJVcowQdkDdaWGofaar8BRuG88VGGtQ/exec";

      window.galleryState = {
        isUserTouching: false,
        touchStartX: 0,
        touchStartY: 0,
        deltaZ: 0,
        sensitivity: 0.02,
        autoScrollSpeed: 0.015,
        leftTrackMaxSpan: 0,
        rightTrackMaxSpan: 0,
        isBtnScrolling: false,
        btnScrollDir: 0,
        btnScrollSpeedMultiplier: 1.0
      };

      // LIVE REAL-TIME SHIELD RESTRUCTURE ENGINE CONTEXTS
      window.leftTrackItems = [];
      window.rightTrackItems = [];
      window.loadedImageUrls = new Set();
      window.totalImagesProcessed = 0;
      // NEW MEMORY GLOBALS
      window.allExhibitionData = []; 
      window.currentBatchIndex = 0;
      window.BATCH_SIZE = 20; 
      window.batchRotationInterval = null;

      // Helper function to format author name: if length > 10 characters, split into 2 lines near middle space
      function formatAuthorName(name) {
        if (!name) return "Unknown";
        if (name.length <= 10) return name;
        
        // Find all space indexes to split near the middle
        const spaces = [];
        for (let i = 0; i < name.length; i++) {
          if (name[i] === ' ') spaces.push(i);
        }
        
        if (spaces.length === 0) {
          // Fallback if no spaces exist: forced middle truncation split
          const mid = Math.ceil(name.length / 2);
          return name.substring(0, mid) + '\n' + name.substring(mid);
        }
        
        // Pick the space closest to the exact mathematical center character
        const center = name.length / 2;
        let bestSpaceIdx = spaces[0];
        let minDiff = Math.abs(spaces[0] - center);
        
        for (let i = 1; i < spaces.length; i++) {
          let diff = Math.abs(spaces[i] - center);
          if (diff < minDiff) {
            minDiff = diff;
            bestSpaceIdx = spaces[i];
          }
        }
        
        return name.substring(0, bestSpaceIdx) + '\n' + name.substring(bestSpaceIdx + 1);
      }

      // Passed directly through since Google Apps Script handles formatting at the data layer
      function getDirectImageUrl(url) {
        return url;
      }

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.touches[0].clientX;
          window.galleryState.touchStartY = e.touches[0].clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && window.galleryState.isUserTouching) {
          handleInteractionMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      });

      window.addEventListener('touchend', () => {
        window.galleryState.isUserTouching = false;
        window.galleryState.deltaZ = 0;
      });

      window.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = true;
          window.galleryState.touchStartX = e.clientX;
          window.galleryState.touchStartY = e.clientY;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (window.galleryState.isUserTouching) {
          handleInteractionMove(e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 2) {
          window.galleryState.isUserTouching = false;
          window.galleryState.deltaZ = 0;
        }
      });

      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      function handleInteractionMove(currentX, currentY) {
        let diffX = currentX - window.galleryState.touchStartX;
        let diffY = currentY - window.galleryState.touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
          window.galleryState.deltaZ = diffX;
        } else {
          window.galleryState.deltaZ = -diffY; 
        }

        window.galleryState.touchStartX = currentX;
        window.galleryState.touchStartY = currentY;
      }

      AFRAME.registerComponent('conveyor-item', {
        schema: {
          trackSide: { type: 'string', default: 'left' }
        },
        init: function () {
          this.isInitialized = false;
        },
        setupBounds: function(totalSpan) {
          this.minZ = -totalSpan / 2;
          this.maxZ = totalSpan / 2;
          this.totalSpan = totalSpan;
          this.isInitialized = true;
        },
        tick: function () {
          let globalSpan = (this.data.trackSide === 'left') ? window.galleryState.leftTrackMaxSpan : window.galleryState.rightTrackMaxSpan;
          
          if (globalSpan <= 0) return;
          
          if (!this.isInitialized || this.totalSpan !== globalSpan) {
            this.setupBounds(globalSpan);
          }

          let position = this.el.getAttribute('position');
          let currentZ = position.z;

          if (window.galleryState.isBtnScrolling) {
            currentZ += window.galleryState.btnScrollDir * 0.05 * window.galleryState.btnScrollSpeedMultiplier; 
          } else if (window.galleryState.isUserTouching) {
            currentZ += window.galleryState.deltaZ * window.galleryState.sensitivity;
          } else {
            currentZ -= window.galleryState.autoScrollSpeed;
          }

          if (currentZ < this.minZ) {
            currentZ += this.totalSpan;
          } else if (currentZ > this.maxZ) {
            currentZ -= this.totalSpan;
          }

          this.el.setAttribute('position', { x: position.x, y: position.y, z: currentZ });
        }
      });

      function getDirectImageUrl(url) {
        if (!url) return '';
        let cleanUrl = url.trim();
        // Ensure protocol is present
        if (cleanUrl.startsWith('//')) {
          cleanUrl = 'https:' + cleanUrl;
        }
        return cleanUrl;
      }

      function clearCurrentGallery(sceneEl, assetsEl) {
        sceneEl.querySelectorAll('[conveyor-item]').forEach(frame => {
          if (frame.parentNode) frame.parentNode.removeChild(frame);
        });
        assetsEl.querySelectorAll('img[id^="live-img-"]').forEach(asset => {
          asset.removeAttribute('src'); 
          if (asset.parentNode) asset.parentNode.removeChild(asset);
        });
        window.leftTrackItems = [];
        window.rightTrackItems = [];
        window.loadedImageUrls.clear();
        window.galleryState.leftTrackMaxSpan = 0;
        window.galleryState.rightTrackMaxSpan = 0;
      }

      function renderGalleryBatch(sceneEl, assetsEl) {
        clearCurrentGallery(sceneEl, assetsEl);
        if (window.allExhibitionData.length === 0) return;

        let startIdx = window.currentBatchIndex * window.BATCH_SIZE;
        let endIdx = Math.min(startIdx + window.BATCH_SIZE, window.allExhibitionData.length);
        let batchImages = window.allExhibitionData.slice(startIdx, endIdx);
        
        if (batchImages.length === 0) {
          window.currentBatchIndex = 0;
          startIdx = 0;
          endIdx = Math.min(window.BATCH_SIZE, window.allExhibitionData.length);
          batchImages = window.allExhibitionData.slice(startIdx, endIdx);
        }

        let processedCount = 0;
        batchImages.forEach((imgData, index) => {
          window.loadedImageUrls.add(imgData.src);
          let safeUrl = getDirectImageUrl(imgData.src);

          let imgAsset = document.createElement('img');
          imgAsset.setAttribute('id', `live-img-${Date.now()}-${index}`);
          imgAsset.setAttribute('src', safeUrl);
          imgAsset.setAttribute('crossorigin', 'anonymous');
          assetsEl.appendChild(imgAsset);

          let aImg = document.createElement('a-image');
          let isLeft = index % 2 === 0;
          aImg.setAttribute('src', `#${imgAsset.id}`);
          aImg.setAttribute('conveyor-item', `trackSide: ${isLeft ? 'left' : 'right'}`);
          if (isLeft) aImg.setAttribute('material', 'side: double');

          let aText = document.createElement('a-text');
          let rawAuthorName = imgData.participantName || imgData.name || imgData.author || "Participant";
          aText.setAttribute('value', formatAuthorName(rawAuthorName));
          aText.setAttribute('align', 'center'); 
          aText.setAttribute('color', '#ffffff');
          aText.setAttribute('width', '1.8'); 
          aText.setAttribute('font', 'dejavu');
          aText.setAttribute('shader', 'msdf'); 
          aText.setAttribute('negate', 'false');
          aImg.appendChild(aText);

          let newObj = { item: aImg, asset: imgAsset, txt: aText, calculatedWidth: 3.2, calculatedHeight: 1.8 };
          if (isLeft) window.leftTrackItems.push(newObj);
          else window.rightTrackItems.push(newObj);
          sceneEl.appendChild(aImg);

          const finalizeLayout = () => {
            processedCount++;
            if (processedCount === batchImages.length) {
              rearrangeTrackAfterUpdates(window.leftTrackItems, '-3', '0 90 0', 'left');
              rearrangeTrackAfterUpdates(window.rightTrackItems, '3', '0 -90 0', 'right');
            }
          };

          if (imgAsset.complete) {
            calculateTargetDimensions(newObj);
            finalizeLayout();
          } else {
            imgAsset.addEventListener('load', () => { calculateTargetDimensions(newObj); finalizeLayout(); });
            imgAsset.addEventListener('error', finalizeLayout);
          }
        });
      }

      function startLivePollingEngine(sceneEl, assetsEl) {
        setInterval(() => {
          fetch(LIVE_GET_API_URL).then(res => res.json()).then(data => {
            let images = [];
            if (Array.isArray(data)) images = data;
            else if (data && Array.isArray(data.exhibition)) images = data.exhibition;
            else if (data && Array.isArray(data.images)) images = data.images.map(img => ({ src: img.url || img.src, participantName: img.participantName || img.email || "Participant" }));
            
            if (images && images.length > 0) window.allExhibitionData = images;
          }).catch(e => console.warn("Live fetch error", e));
        }, 30000);

        window.batchRotationInterval = setInterval(() => {
          if (window.allExhibitionData.length <= window.BATCH_SIZE) return;
          window.currentBatchIndex++;
          if (window.currentBatchIndex * window.BATCH_SIZE >= window.allExhibitionData.length) window.currentBatchIndex = 0; 
          
          const connStatus = document.getElementById('connection-status');
          const overlayDesc = document.getElementById('overlay-desc');
          const overlay = document.getElementById('overlay');
          
          if (connStatus && overlay) {
            overlay.style.display = 'flex';
            overlay.style.background = 'transparent';
            const titleEl = document.getElementById('overlay-title');
            const logoEl = document.querySelector('.overlay-logo');
            const modeArea = document.getElementById('mode-selection-area');
            
            if(titleEl) titleEl.style.display = 'none';
            if(logoEl) logoEl.style.display = 'none';
            if(modeArea) modeArea.style.display = 'none';
            
            overlayDesc.innerText = `Loading Gallery Section ${window.currentBatchIndex + 1}...`;
            connStatus.innerText = "";
            connStatus.style.display = "block";
            
            setTimeout(() => { 
                overlay.style.display = 'none';
                if(titleEl) titleEl.style.display = 'block';
                if(logoEl) logoEl.style.display = 'block';
            }, 2500);
          }
          renderGalleryBatch(sceneEl, assetsEl);
        }, 35000);
      }

      // Macro positioning alignment algorithm ensuring strict gaps and handling vertical-landscape collisions
      function rearrangeTrackAfterUpdates(elementsArray, xPos, rotation, sideName, forceResetPositions = true) {
        let currentZAccumulator = 0;
        
        elementsArray.forEach((obj, idx) => {
          let marginBetweenFrames = 1.2; // Base global spacing cushion
          
          if (idx > 0) {
            let prevObj = elementsArray[idx - 1];
            let isCurrentVertical = (obj.calculatedHeight > obj.calculatedWidth);
            let isPrevVertical = (prevObj.calculatedHeight > prevObj.calculatedWidth);
            
            // Apply defensive layout spacing if a portrait image is next to a landscape layout frame
            if (isCurrentVertical !== isPrevVertical) {
              marginBetweenFrames = 1.8; 
            }
          }

          currentZAccumulator += (obj.calculatedWidth / 2);
          obj.initialZ = currentZAccumulator;
          currentZAccumulator += (obj.calculatedWidth / 2) + marginBetweenFrames;
        });
        
        let totalSpan = currentZAccumulator;
        if (sideName === 'left') {
          window.galleryState.leftTrackMaxSpan = totalSpan;
        } else {
          window.galleryState.rightTrackMaxSpan = totalSpan;
        }
        
        // CRUCIAL: Only alter positions during cold initial load to prevent real-time scrolling snapping bugs
        if (forceResetPositions) {
          elementsArray.forEach(obj => {
            let centeredZ = obj.initialZ - (totalSpan / 2);
            obj.item.setAttribute('position', `${xPos} 0 ${centeredZ}`);
            obj.item.setAttribute('rotation', rotation);
          });
        }
      }

      AFRAME.registerComponent('gallery-loader', {
        init: function () {
          const sceneEl = this.el;
          const assetsEl = document.querySelector('a-assets');
          const connectionStatus = document.getElementById('connection-status');
          const modeSelectionArea = document.getElementById('mode-selection-area');

          sceneEl.addEventListener('render-target-loaded', () => {
            if (sceneEl.renderer) {
              sceneEl.renderer.setClearColor(0x000000, 0);
              sceneEl.renderer.alpha = true;
            }
          });

          connectionStatus.innerText = "Connecting Live Feed...";

            fetch(LIVE_GET_API_URL)
            .then(res => res.json())
            .then(data => {
              // 🔴 FLEXIBLE ARRAY EXTRACTION LOGIC
              let images = [];
              if (Array.isArray(data)) {
                images = data; // Direct array (exhibition stream)
              } else if (data && Array.isArray(data.exhibition)) {
                images = data.exhibition; // Full payload containing exhibition bucket
              } else if (data && Array.isArray(data.images)) {
                // Legacy compatibility fallback
                images = data.images.map(img => ({
                  src: img.url || img.src,
                  participantName: img.participantName || img.email || "Participant",
                  photoTitle: img.photoTitle || "Untitled",
                  categoryDisplay: img.categoryDisplay || ""
                }));
              }

              if(!images || images.length === 0) {
                document.getElementById('overlay-desc').innerText = "No submitted pictures found in database yet.";
                connectionStatus.innerText = "Gallery Empty";
                return;
              }

              window.totalImagesProcessed = images.length;

              window.allExhibitionData = images;
            window.currentBatchIndex = 0;
            renderGalleryBatch(sceneEl, assetsEl); // Builds the first 20

            connStatus.style.display = "none";
            modeArea.style.display = "block";
            const guideText = document.getElementById('loading-guide-text');
            if (guideText) guideText.innerHTML = (typeof isMobile !== 'undefined' && isMobile) ? window.exhibitionGuides['mobile-loading'] : window.exhibitionGuides['laptop'];
            
            if (typeof checkHardwareGyroscope === 'function') checkHardwareGyroscope();
            startLivePollingEngine(sceneEl, assetsEl);

              let processedCount = 0;
              const totalToProcess = images.length;

              function checkProcessingComplete() {
                processedCount++;
                if (processedCount === totalToProcess) {
                  rearrangeTrackAfterUpdates(window.leftTrackItems, '-3', '0 90 0', 'left', true);
                  rearrangeTrackAfterUpdates(window.rightTrackItems, '3', '0 -90 0', 'right', true);

                  connectionStatus.style.display = "none";
                  modeSelectionArea.style.display = "block";
                  
                  const guideTextDiv = document.getElementById('loading-guide-text');
                  if (guideTextDiv) {
                    guideTextDiv.innerHTML = isMobile ? window.exhibitionGuides['mobile-loading'] : window.exhibitionGuides['laptop'];
                  }
                  
                  checkHardwareGyroscope();
                  startLivePollingEngine(sceneEl, assetsEl);
                }
              }

              [...window.leftTrackItems, ...window.rightTrackItems].forEach(obj => {
                if (obj.asset.complete) {
                  calculateTargetDimensions(obj);
                  checkProcessingComplete();
                } else {
                  obj.asset.addEventListener('load', function() {
                    calculateTargetDimensions(obj);
                    checkProcessingComplete();
                  });
                  obj.asset.addEventListener('error', function() {
                    obj.calculatedWidth = 3.2;
                    obj.calculatedHeight = 1.8;
                    checkProcessingComplete();
                  });
                }
              });

              function calculateTargetDimensions(obj) {
                let width = obj.asset.naturalWidth || 16;
                let height = obj.asset.naturalHeight || 9;
                let aspectRatio = width / height;

                let maxBoundaryWidth = 3.2;
                let maxBoundaryHeight = 1.8;

                if (aspectRatio > (maxBoundaryWidth / maxBoundaryHeight)) {
                  obj.calculatedWidth = maxBoundaryWidth;
                  obj.calculatedHeight = maxBoundaryWidth / aspectRatio;
                } else {
                  obj.calculatedHeight = maxBoundaryHeight;
                  obj.calculatedWidth = maxBoundaryHeight * aspectRatio;
                }
                
                obj.item.setAttribute('width', obj.calculatedWidth);
                obj.item.setAttribute('height', obj.calculatedHeight);

                if (obj.txt) {
                  // Reduced height offset to 0.12 so the smaller text sits closer to the top border frame
                  obj.txt.setAttribute('position', `0 ${(obj.calculatedHeight / 2) + 0.12} 0.1`);
                }
              }
            })
            .catch(err => {
              console.error("Live fetch failed:", err);
              document.getElementById('connection-status').innerText = "Error syncing submissions with Google Sheet.";
            });
        }
      });



// IOS issue fix
AFRAME.registerComponent('ios-performance-fix', {
    init: function () {
      // 1. Strictly check if the user is on an iPhone, iPad, or iPod
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        const scene = this.el;

        // 2. Only lower graphics settings for iOS to prevent Safari memory crashes
        scene.setAttribute('renderer', {
          antialias: false,
          precision: 'medium',
          alpha: true,
          colorManagement: true
        });

        // 3. Clamp the Retina display 3x scaling down to a safe 1x canvas size
        if (scene.renderer) {
          scene.renderer.setPixelRatio(1);
        } else {
          scene.addEventListener('nodeready', () => {
            if (scene.renderer) scene.renderer.setPixelRatio(1);
          });
        }
      }
    }
  });


    </script>
  </head>
  <body>

    <div id="loader">
      <div class="loader-container">
          <img src="/assets/img/logo.png" alt="Logo" class="loader-logo">
      </div>
    </div>

    <div id="overlay">
      <img src="/assets/img/logo.png" alt="Logo" class="overlay-logo" />
      <h2 id="overlay-title">Participants Exhibition</h2>
      <p id="overlay-desc">Synchronizing with live data...</p>
      
      <div id="connection-status" style="font-weight: bold; color: #f59e0b;">Initializing modules...</div>

      <div id="mode-selection-area" style="display: none; width: 100%;">
        
        <div id="specs-warning-box" style="display: none; background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 10px; padding: 12px; margin: 0 auto 20px auto; text-align: left; max-width: 380px;">
          <span style="color: #f87171; font-weight: bold; font-size: 13px;">⚠️ Notice:</span>
          <p style="margin: 3px 0 0 0; font-size: 12px; color: #cbd5e1; line-height: 1.4;">
            Your phone lacks a physical gyroscope sensor or minimum requirements. <b>AR Mode is disabled</b>, but you can explore perfectly using <b>Basic Mode</b>.
          </p>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
          <button id="select-ar-btn" class="mode-btn btn-ar">
            <span>✨ Option 1: AR Mode</span>
            <span class="sub-text">Turn your physical phone around to see the photos.</span>
          </button>

          <button id="select-basic-btn" class="mode-btn btn-basic">
            <span>📱 Option 2: Basic Mode</span>
            <span class="sub-text">Use your fingers to swipe the screen to look around.</span>
          </button>
        </div>

        <div id="loading-guide-box" style="background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 12px; padding: 15px; margin: 20px auto 0 auto; text-align: left; max-width: 380px; width: 100%; box-sizing: border-box;">
          <h4 style="margin: 0 0 10px 0; font-size: 14px; color: #f59e0b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">💡 Exhibition Guide</h4>
          <div id="loading-guide-text" style="font-size: 13px; color: #cbd5e1; line-height: 1.4;"></div>
        </div>
      </div>
    </div>

    

    <a-scene vr-mode-ui="enabled: false" embedded renderer="alpha: true; colorManagement: true;" gallery-loader cursor="rayOrigin: mouse" raycaster="objects: .clickable">

      const mainCamera = document.getElementById('main-camera');
      
      const selectArBtn = document.getElementById('select-ar-btn');
      const selectBasicBtn = document.getElementById('select-basic-btn');
      const specsWarningBox = document.getElementById('specs-warning-box');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      function checkHardwareGyroscope() {
        if (!isMobile) return;
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          return;
        }

        let gyroDetected = false;
        function sensorTest(event) {
          if (event.alpha !== null || event.beta !== null || event.gamma !== null) {
            gyroDetected = true;
          }
          window.removeEventListener('deviceorientation', sensorTest);
        }
        window.addEventListener('deviceorientation', sensorTest);

        setTimeout(() => {
          if (!gyroDetected) {
            selectArBtn.disabled = true;
            specsWarningBox.style.display = "block";
          }
        }, 600);
      }

      const forceSceneClearTransparency = () => {
        if (scene) {
          scene.style.backgroundColor = "transparent";
          scene.style.background = "transparent";
        }
        document.querySelectorAll('.a-canvas').forEach(canvas => {
          canvas.style.backgroundColor = "transparent";
          canvas.style.background = "transparent";
        });
        if (scene && scene.renderer) {
          scene.renderer.setClearColor(0x000000, 0);
        }
      };

      function activateMobilePermissions() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().catch(console.error);
        }

        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
        })
        .then((stream) => {
          nativeVideo.srcObject = stream;
          nativeVideo.addEventListener('playing', () => {
            forceSceneClearTransparency();
            nativeVideo.style.display = "block";
          }, { once: true });
          nativeVideo.play().catch(e => console.log(e));
        })
        .catch((err) => {
          console.error("Camera access denied:", err);
          if (scene) scene.style.backgroundColor = "#1a1a1a";
        });
      }

      function revealControlPods() {
        const leftGroup = document.getElementById('left-controls-group');
        const rightGroup = document.getElementById('right-controls-group');
        if (leftGroup) leftGroup.setAttribute('visible', 'true');
        if (rightGroup) rightGroup.setAttribute('visible', 'true');
      }

      function showInfoBadge() {
        const infoBtn = document.getElementById('info-btn');
        if (infoBtn) infoBtn.style.display = 'flex';
      }

      selectArBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        activeMode = 'mobile-ar';
        showInfoBadge();
        if (isMobile) {
          mainCamera.setAttribute('look-controls', 'magicWindowTrackingEnabled: true; touchEnabled: false;');
          // Boost the camera Field of View to 95 to expand the portrait width angle on smartphones
          mainCamera.setAttribute('camera', 'fov', 95);
          forceSceneClearTransparency();
          activateMobilePermissions();
        } else {
          revealControlPods();
          if (scene) scene.style.backgroundColor = "#1a1a1a";
          mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
        }
      });

      selectBasicBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        activeMode = 'mobile-basic';
        showInfoBadge();
        revealControlPods();

        if (isMobile) {
          mainCamera.setAttribute('look-controls', 'magicWindowTrackingEnabled: false; touchEnabled: true;');
          // Boost the camera Field of View to 95 to expand the portrait width angle on smartphones
          mainCamera.setAttribute('camera', 'fov', 95);
          if (nativeVideo) nativeVideo.style.display = "none";
          if (scene) scene.style.backgroundColor = "#1a1a1a";
        } else {
          if (scene) scene.style.backgroundColor = "#1a1a1a";
          mainCamera.setAttribute('look-controls', 'touchEnabled: false;');
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const logoBtn = document.getElementById('winners-logo-btn');
        const logoTooltip = document.getElementById('logo-tooltip');

        if (!isMobile) {
          if (selectArBtn && selectBasicBtn) {
            const buttonContainer = selectArBtn.parentElement;
            if (buttonContainer) {
              buttonContainer.innerHTML = `
                <button id="laptop-enter-btn" class="mode-btn btn-ar" style="width: 100%; max-width: 280px; margin: 0 auto;">
                  <span>Enter Exhibition</span>
                </button>
              `;
              
              document.getElementById('laptop-enter-btn').addEventListener('click', () => {
                overlay.style.display = 'none';
                activeMode = 'laptop';
                showInfoBadge();
                revealControlPods();
                if (scene) scene.style.backgroundColor = "#1a1a1a";
                mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
              });
            }
          }
        } else {
          checkHardwareGyroscope();
        }

        function registerPodButton(id, directionalFlag, speedMultiplier) {
          const buttonEl = document.getElementById(id);
          if (!buttonEl) return;

          const startScrolling = () => {
            window.galleryState.isBtnScrolling = true;
            window.galleryState.btnScrollDir = directionalFlag;
            window.galleryState.btnScrollSpeedMultiplier = speedMultiplier;
          };

          const stopScrolling = () => {
            window.galleryState.isBtnScrolling = false;
          };

          buttonEl.addEventListener('mousedown', startScrolling);
          buttonEl.addEventListener('mouseup', stopScrolling);
          buttonEl.addEventListener('mouseleave', stopScrolling);

          buttonEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startScrolling();
          });
          buttonEl.addEventListener('touchend', stopScrolling);
        }

        registerPodButton('btn-left-ff', 1, 3.5);          
        registerPodButton('btn-left-normal-left', 1, 1.0);  
        registerPodButton('btn-left-normal-right', -1, 1.0); 
        registerPodButton('btn-left-rw', -1, 3.5);          

        // Reversed direction flags to compensate for the 180-degree flipped perspective on the right wall
        registerPodButton('btn-right-ff', -1, 3.5);          
        registerPodButton('btn-right-normal-left', -1, 1.0);  
        registerPodButton('btn-right-normal-right', 1, 1.0); 
        registerPodButton('btn-right-rw', 1, 3.5);          

        if (logoTooltip) {
          const textPlane = document.getElementById('logo-tooltip-text');
          if (textPlane) {
            const drawCanvasText = () => {
              const canvas = document.createElement('canvas');
              canvas.width = 1400;
              canvas.height = 650; 
              const ctx = canvas.getContext('2d');
              
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              
              const midX = canvas.width / 2;

              ctx.font = 'bold 120px Poppins, sans-serif';
              ctx.fillStyle = '#f59e0b';
              ctx.fillText('^', midX, 130);
              
              ctx.font = 'bold 80px Poppins, sans-serif';
              ctx.fillStyle = '#f59e0b';
              ctx.fillText('VIEW WINNERS', midX, 310);
              
              const doubleTapText = 'DOUBLE TAP TO GO';
              ctx.font = 'bold 60px Poppins, sans-serif';
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 15;
              ctx.lineJoin = 'round';
              ctx.miterLimit = 2;
              ctx.strokeText(doubleTapText, midX, 480);
              ctx.fillStyle = '#ffffff';
              ctx.fillText(doubleTapText, midX, 480);

              textPlane.setAttribute('material', 'src', canvas);

              const mesh = textPlane.getObject3D('mesh');
              if (mesh && mesh.material && mesh.material.map) {
                mesh.material.map.needsUpdate = true;
              }
            };

            if (document.fonts) {
              document.fonts.ready.then(drawCanvasText);
            } else {
              drawCanvasText();
            }
            
            textPlane.addEventListener('materialtextureloaded', () => {
              const mesh = textPlane.getObject3D('mesh');
              if (mesh && mesh.material && mesh.material.map) {
                mesh.material.map.needsUpdate = true;
              }
            });
          }
        }

        const infoBtn = document.getElementById('info-btn');
        const infoTooltipUi = document.getElementById('info-tooltip-ui');
        const guideModal = document.getElementById('guide-modal');
        const modalGuideTitle = document.getElementById('modal-guide-title');
        const modalGuideBody = document.getElementById('modal-guide-body');
        const closeModalBtn = document.getElementById('close-modal-btn');

        if (infoBtn) {
          infoBtn.addEventListener('mouseenter', () => {
            if (infoTooltipUi) infoTooltipUi.style.opacity = '1';
          });
          infoBtn.addEventListener('mouseleave', () => {
            if (infoTooltipUi) infoTooltipUi.style.opacity = '0';
          });
          
          infoBtn.addEventListener('click', () => {
            if (guideModal && modalGuideBody && modalGuideTitle) {
              if (activeMode === 'laptop') {
                modalGuideTitle.innerText = "Laptop Guide";
                modalGuideBody.innerHTML = window.exhibitionGuides['laptop'];
              } else if (activeMode === 'mobile-ar') {
                modalGuideTitle.innerText = "Mobile AR Guide";
                modalGuideBody.innerHTML = window.exhibitionGuides['mobile-ar'];
              } else if (activeMode === 'mobile-basic') {
                modalGuideTitle.innerText = "Mobile Basic Guide";
                modalGuideBody.innerHTML = window.exhibitionGuides['mobile-basic'];
              }
              guideModal.style.display = 'flex';
            }
          });
        }

        if (closeModalBtn && guideModal) {
          closeModalBtn.addEventListener('click', () => {
            guideModal.style.display = 'none';
            // Force A-Frame to recalculate sizing post-modal closure for iOS stability
            document.querySelector('a-scene').resize();
          });
        }

        if (logoBtn) {
          let lastClickTime = 0;

          logoBtn.addEventListener('mouseenter', () => {
            logoBtn.setAttribute('material', 'color', '#ffeaa7'); 
            if (logoTooltip) logoTooltip.setAttribute('visible', 'true');
          });
          logoBtn.addEventListener('mouseleave', () => {
            logoBtn.setAttribute('material', 'color', '#ffffff');
            if (logoTooltip) logoTooltip.setAttribute('visible', 'false');
          });
          
          logoBtn.addEventListener('click', () => {
            const currentTime = Date.now();
            const clickDelay = currentTime - lastClickTime;
            
            if (clickDelay > 0 && clickDelay < 350) {
              window.location.href = 'winners-exhibition.html';
            }
            lastClickTime = currentTime;
          });
        }
      });
    </script>
  </body>
</html>

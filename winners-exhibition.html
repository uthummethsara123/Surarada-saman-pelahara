<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Winners Exhibition - Surarada Saman Pelahara</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #440613 0%, #540818 100%);
        -webkit-tap-highlight-color: transparent;
      }

      /* Native background webcam stream styling */
      #webcam-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
        display: none;
      }

      a-scene, .a-canvas {
        background-color: transparent !important;
        background: transparent !important;
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #440613 0%, #540818 100%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .overlay-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #f59e0b;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      }

      p {
        margin: 0 0 20px 0;
        font-size: 1rem;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.5;
      }

      .mode-btn {
        width: 100%;
        max-width: 380px;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-bottom: 12px;
      }

      .btn-ar {
        background: #f59e0b;
        color: #0f172a;
        border: none;
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.25);
      }

      .btn-ar:hover:not(:disabled) {
        transform: translateY(-2px);
        background: #fbbf24;
        box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
      }

      .btn-ar:disabled {
        background-color: #475569 !important;
        color: #94a3b8 !important;
        cursor: not-allowed;
        box-shadow: none !important;
        opacity: 0.5;
      }

      .btn-basic {
        background: transparent;
        color: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      .btn-basic:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #ffffff;
        transform: translateY(-2px);
      }

      .sub-text {
        font-size: 11px;
        font-weight: normal;
        text-transform: none;
        opacity: 0.85;
        letter-spacing: 0;
      }

      #move-hint {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
        padding: 10px 20px;
        border-radius: 30px;
        font-family: monospace;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 90;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        text-align: center;
      }

      #nav-hud-status {
        position: fixed;
        bottom: 30px;
        left: 30px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
        padding: 12px 20px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 95;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        line-height: 1.6;
        text-align: left;
      }
      #nav-hud-status b {
        color: #ffffff;
      }

      /* Guide Modal Custom Presentation Wrapper */
      #guideDisplayModal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #480714f0;
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .guide-card {
        background: #480714;
        border: 2px solid #f59e0b;
        padding: 25px;
        border-radius: 16px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        font-family: 'Poppins', sans-serif;
        color: white;
      }
    </style>

// 4. GLOBAL LIFECYCLE APP EVENTS (Loader Window Locks)
// ==========================================================================
document.documentElement.classList.add('lock-scrolling');
document.body.classList.add('lock-scrolling');
document.documentElement.style.overflow = "hidden";
document.body.style.overflow = "hidden";

const forceUnlockTimeout = setTimeout(() => {
    cleanUpAndDestroyLoader("Safety Timeout Triggered");
}, 3500);

function cleanUpAndDestroyLoader(reason) {
    console.log("Loader Dismissed via:", reason);
    const loader = document.getElementById("loader");
    if (loader) {
        loader.style.display = "none";
    }
    document.documentElement.classList.remove('lock-scrolling');
    document.body.classList.remove('lock-scrolling');
    document.documentElement.style.overflow = "auto";
    document.body.style.overflow = "auto";
}

window.addEventListener("load", () => {
    clearTimeout(forceUnlockTimeout);
    setTimeout(() => {
        cleanUpAndDestroyLoader("Standard Window Load Event");
    }, 1200);
});

if (typeof ScrollReveal !== 'undefined') {
    ScrollReveal().reveal('.section-title, .about-section, .gallery-section, .schools-bar', {
        distance: '60px',
        duration: 1200,
        origin: 'bottom',
        interval: 200
    });
}


      // PATCH: Force A-Frame look-controls to allow both vertical (pitch) and horizontal (yaw) dragging on touch screens
      if (typeof AFRAME !== 'undefined' && AFRAME.components['look-controls']) {
        AFRAME.components['look-controls'].Component.prototype.onTouchMove = function (evt) {
          if (!this.touchStarted || !this.data.touchEnabled) { return; }
          
          const canvas = this.el.sceneEl.canvas;
          const touch = evt.touches[0];
          
          // Calculate movement delta
          const movementX = touch.pageX - this.touchStart.x;
          const movementY = touch.pageY - this.touchStart.y;
          
          // Update horizontal (yaw) and vertical (pitch) rotation objects directly
          // Adjust pitchObject.rotation.x for looking up and down
          const direction = this.data.reverseTouchDrag ? -1 : 1;
          
          this.pitchObject.rotation.x += (direction * movementY * Math.PI) / canvas.clientHeight;
          this.yawObject.rotation.y += (direction * movementX * Math.PI) / canvas.clientWidth;
          
          // Constrain vertical look to avoid flipping upside down (-85 to +85 degrees)
          this.pitchObject.rotation.x = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, this.pitchObject.rotation.x));
          
          // Update reference coordinates for next frame
          this.touchStart.x = touch.pageX;
          this.touchStart.y = touch.pageY;
        };
      }

      const overlay = document.getElementById('overlay');
      const moveHint = document.getElementById('move-hint');
      const hudStatus = document.getElementById('nav-hud-status');
      const scene = document.querySelector('a-scene');
      const nativeVideo = document.getElementById('webcam-video');
      const mobileNavPad = document.getElementById('mobile-nav-pad');
      const toggleLayoutBtn = document.getElementById('toggle-layout-btn');
      
      const selectArBtn = document.getElementById('select-ar-btn');
      const selectBasicBtn = document.getElementById('select-basic-btn');
      const specsWarningBox = document.getElementById('specs-warning-box');
      const mainCamera = document.getElementById('main-camera');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      
      const activeKeys = {};
      const moveSpeed = 0.11; 

      let isMovingUp = false;
      let isMovingDown = false;
      let isMovingLeft = false;
      let isMovingRight = false;
      let isLandscapeMappingMode = false;

      // Track if basic option tracking is active
      let isBasicOptionActive = false;

      // Checks physical hardware sensor parameters for mobile configurations
      function checkHardwareGyroscope() {
        if (!isMobile) return;

        // iOS Fix: iPhones block sensor access until a user gesture grants permission.
        // If the permission method exists, skip this passive test so the AR button isn't falsely disabled.
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          return;
        }

        let gyroDetected = false;
        function sensorTest(event) {
          if (event.alpha !== null || event.beta !== null || event.gamma !== null) {
            gyroDetected = true;
          }
          window.removeEventListener('deviceorientation', sensorTest);
        }
        window.addEventListener('deviceorientation', sensorTest);

        setTimeout(() => {
          if (!gyroDetected) {
            const currentArBtn = document.getElementById('select-ar-btn');
            const currentWarningBox = document.getElementById('specs-warning-box');

            if (currentArBtn) {
              currentArBtn.disabled = true;
            }
            if (currentWarningBox) {
              currentWarningBox.style.display = "block";
            }
          }
        }, 600);
      }

      // Hardware level sensor monitoring logic for system rotation lock check
      function initBasicModeRotationWatcher() {
        if (!isMobile) return;

        window.addEventListener('deviceorientation', (event) => {
          if (!isBasicOptionActive) return;
          const warningBox = document.getElementById('rotate-warning-overlay');
          if (!warningBox) return;

          const absGamma = Math.abs(event.gamma);
          const absBeta = Math.abs(event.beta);

          const isBrowserPortraitLayout = window.innerHeight > window.innerWidth;
          const isPhysicallyLandscapeTilt = (absGamma > 65 && absBeta < 45) || (absBeta > 65 && absGamma < 45);

          if (isPhysicallyLandscapeTilt && isBrowserPortraitLayout) {
            warningBox.style.display = 'flex';
          } else {
            warningBox.style.display = 'none';
          }
        });
      }

      const forceSceneClearTransparency = () => {
        if (scene) {
          scene.style.backgroundColor = "transparent";
          scene.style.background = "transparent";
        }
        document.querySelectorAll('.a-canvas').forEach(canvas => {
          canvas.style.backgroundColor = "transparent";
          canvas.style.background = "transparent";
        });
        if (scene && scene.renderer) {
          scene.renderer.setClearColor(0x000000, 0);
        }
      };

      function moveRigWithStrictCarpetBounds(forwardAmount, strafeAmount) {
        const rig = document.getElementById('camera-rig');
        const cam = document.getElementById('main-camera');
        if (!rig || !cam) return;

        let rotation = cam.getAttribute('rotation');
        let angleRad = (rotation.y * Math.PI) / 180;
        let currentPos = rig.getAttribute('position');
        
        let nextX = currentPos.x - Math.sin(angleRad) * forwardAmount;
        let nextZ = currentPos.z - Math.cos(angleRad) * forwardAmount;

        nextX += Math.cos(angleRad) * strafeAmount;
        nextZ -= Math.sin(angleRad) * strafeAmount;

        const CARPET_MAX_X = 1.3; 
        const CARPET_MIN_X = -1.3;
        const CORRIDOR_MAX_Z = 6.0;
        const CORRIDOR_MIN_Z = -54.0;

        if (nextX > CARPET_MAX_X || nextX < CARPET_MIN_X || nextZ > CORRIDOR_MAX_Z || nextZ < CORRIDOR_MIN_Z) {
          return; 
        }

        rig.setAttribute('position', { x: nextX, y: currentPos.y, z: nextZ });
      }

if (isMobile) {
        const setupButton = (id, setter) => {
          const btn = document.getElementById(id);
          if (!btn) return; 
          btn.addEventListener('touchstart', (e) => { e.preventDefault(); setter(true); }, {passive: false});
          btn.addEventListener('touchend', (e) => { e.preventDefault(); setter(false); }, {passive: false});
          btn.addEventListener('touchcancel', (e) => { e.preventDefault(); setter(false); }, {passive: false});
        };

        setupButton('btn-move-up', (val) => isMovingUp = val);
        setupButton('btn-move-down', (val) => isMovingDown = val);
        setupButton('btn-move-left', (val) => isMovingLeft = val);
        setupButton('btn-move-right', (val) => isMovingRight = val);

        // Dynamic viewport safety override ensuring dragging doesn't snap browser scroll bounds
        document.body.addEventListener('touchmove', (e) => {

          if (!hudStatus) return;
          if (document.pointerLockElement) {
            hudStatus.innerHTML = "• Controls: <b>WASD / Arrows</b> to Move<br>• Press <b>ESC</b> to free mouse cursor";
          } else {
            hudStatus.innerHTML = "• View Mode Paused<br>• <b>Click scene</b> to lock cursor & walk again";
          }
        });
      }

      function primaryCoreAppLoop() {
        let forward = 0;
        let strafe = 0;

        if (isMobile) {
          let upValue = isMovingUp ? moveSpeed : 0;
          let downValue = isMovingDown ? moveSpeed : 0;
          let leftValue = isMovingLeft ? moveSpeed : 0;
          let rightValue = isMovingRight ? moveSpeed : 0;

          if (isLandscapeMappingMode) {
            forward = rightValue - leftValue; 
            strafe = downValue - upValue;
          } else {
            forward = upValue - downValue;
            strafe = rightValue - leftValue;
          }
        } else {
          if (activeKeys['w'] || activeKeys['arrowup']) forward += moveSpeed;
          if (activeKeys['s'] || activeKeys['arrowdown']) forward -= moveSpeed;
          if (activeKeys['d'] || activeKeys['arrowright']) strafe += moveSpeed;
          if (activeKeys['a'] || activeKeys['arrowleft']) strafe -= moveSpeed;
        }

        if (forward !== 0 || strafe !== 0) {
          moveRigWithStrictCarpetBounds(forward, strafe);
        }
        requestAnimationFrame(primaryCoreAppLoop);
      }

      function activateMobilePermissions() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().catch(console.error);
        }

        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
        })
        .then((stream) => {
          if (!nativeVideo) return;
          nativeVideo.srcObject = stream;
          nativeVideo.addEventListener('playing', () => {
            forceSceneClearTransparency();
            nativeVideo.style.display = "block";
          }, { once: true });
          nativeVideo.play().catch(e => console.log(e));
        })
        .catch((err) => {
          console.error("Camera access denied:", err);
          if (scene) scene.style.backgroundColor = "#540818"; 
        });
      }

// ==========================================================
      // OPTION 1: AR MODE ACTION LOGIC CHAIN
      // ==========================================================
      if (selectArBtn) {
        selectArBtn.addEventListener('click', () => {
          if (selectArBtn.disabled) return;
          isBasicOptionActive = false; 
          if (overlay) overlay.style.display = 'none';
          
          if (isMobile) {
            if (moveHint) moveHint.style.display = 'none';
            if (mobileNavPad) mobileNavPad.style.display = 'block';
            if (mainCamera) mainCamera.setAttribute('look-controls', 'magicWindowTrackingEnabled: true; touchEnabled: false;');
            forceSceneClearTransparency();
            activateMobilePermissions();
            
            // Show Mobile AR Specific dialog box
            chosenMobileContext = 'mobile-ar';
            openModalGuide('mobile-ar');
          } else {
            if (scene) scene.style.backgroundColor = "#540818";
            if (hudStatus) hudStatus.style.display = 'block';
            if (moveHint) {
              moveHint.innerHTML = "Click screen to lock cursor and start exploring!";
              moveHint.style.display = 'block';
            }
            if (mainCamera) mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
            
            // Show Laptop guide directly on desktop confirmation
            openModalGuide('laptop');
          }
        });
      }

// ==========================================================
      // OPTION 2: BASIC MODE ACTION LOGIC CHAIN
      // ==========================================================
      if (selectBasicBtn) {
        selectBasicBtn.addEventListener('click', () => {
          isBasicOptionActive = true; 
          if (overlay) overlay.style.display = 'none';
          
          if (isMobile) {
            if (moveHint) moveHint.style.display = 'none';
            if (mobileNavPad) mobileNavPad.style.display = 'block';
            
            if (mainCamera) {
              mainCamera.removeAttribute('look-controls');
              mainCamera.setAttribute('look-controls', 'magicWindowTrackingEnabled: false; touchEnabled: true;');
            }
            if (nativeVideo) nativeVideo.style.display = 'none';
            if (scene) scene.style.backgroundColor = "#540818";
            
            // Show Mobile Basic Navigation instructions modal
            chosenMobileContext = 'mobile-basic';
            openModalGuide('mobile-basic');
          } else {
            if (scene) scene.style.backgroundColor = "#540818";
            if (hudStatus) hudStatus.style.display = 'block';
            if (moveHint) {
              moveHint.innerHTML = "Click screen to lock cursor and start exploring!";
              moveHint.style.display = 'block';
            }
            if (mainCamera) mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
            
            // Show Laptop Guide for desktop
            openModalGuide('laptop');
          }
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        requestAnimationFrame(primaryCoreAppLoop);
        initBasicModeRotationWatcher(); 
        
        if (!isMobile) {
          if (selectArBtn && selectBasicBtn) {
            selectArBtn.style.display = 'none';
            selectBasicBtn.style.display = 'none';
            
            const buttonContainer = selectArBtn.parentElement;
            if (buttonContainer) {
              const laptopBtn = document.createElement('button');
              laptopBtn.id = 'laptop-enter-btn';
              laptopBtn.className = 'mode-btn btn-ar';
              laptopBtn.style.cssText = 'width: 100%; max-width: 280px; margin: 0 auto; display: block;';
              laptopBtn.innerHTML = '<span>Enter Hall</span>';
              
              buttonContainer.appendChild(laptopBtn);
              
              laptopBtn.addEventListener('click', () => {
                if (overlay) overlay.style.display = 'none';
                if (scene) scene.style.backgroundColor = "#540818";
                if (hudStatus) hudStatus.style.display = 'block';
                if (moveHint) {
                  moveHint.innerHTML = "Click screen to lock cursor and start exploring!";
                  moveHint.style.display = 'block';
                }
                if (mainCamera) mainCamera.setAttribute('look-controls', 'touchEnabled: true;');
              });
            }
          }
        } else {
          checkHardwareGyroscope();
        }
      });

      window.addEventListener('load', () => {
        if (isMobile) {
          checkHardwareGyroscope();
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const exhibitionSign = document.getElementById('btn-to-exhibition');
        const signGlow = document.getElementById('sign-glow');
        const signTooltip = document.getElementById('sign-tooltip');

        if (signTooltip) {
          const canvas = document.createElement('canvas');
          canvas.width = 256;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 26px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('CLICK ME', canvas.width / 2, canvas.height / 2);
          
          signTooltip.setAttribute('material', 'src', canvas);
        }

        if (exhibitionSign) {
          exhibitionSign.addEventListener('mouseenter', () => {
            if (signGlow) signGlow.setAttribute('material', 'opacity', '0.25');
            if (signTooltip) signTooltip.setAttribute('visible', 'true');
          });

          exhibitionSign.addEventListener('mouseleave', () => {
            if (signGlow) signGlow.setAttribute('material', 'opacity', '0');
            if (signTooltip) signTooltip.setAttribute('visible', 'false');
          });

          exhibitionSign.addEventListener('click', () => {
            window.location.href = 'exhibition.html';
          });

          const innerClickables = exhibitionSign.querySelectorAll('.clickable');
          innerClickables.forEach(element => {
            element.addEventListener('click', (e) => {
              e.stopPropagation();
              window.location.href = 'exhibition.html';
            });
          });
        }
      });

// ==========================================================
      // EXHIBITION NAVIGATION GUIDE CONFIGURATIONS
      // ==========================================================
      const exhibitionGuides = {
        'laptop': `
          <ul class="text-start list-unstyled ps-0 mb-0" style="line-height: 1.8; font-size: 0.95rem; color: #cbd5e1;">
            <li class="mb-3"><i class="fas fa-mouse me-2" style="color: #f59e0b;"></i> Look around using touch pad or mouse</li>
            <li class="mb-3"><i class="fas fa-sign-in-alt me-2" style="color: #f59e0b;"></i> Click on the sign to go participants exhibition</li>
            <li><i class="fas fa-keyboard me-2" style="color: #f59e0b;"></i> use wasd or arrows to walk around</li>
          </ul>
        `,
        'mobile-ar': `
          <ul class="text-start list-unstyled ps-0 mb-0" style="line-height: 1.8; font-size: 0.95rem; color: #cbd5e1;">
            <li class="mb-3"><i class="fas fa-mobile-alt me-2" style="color: #f59e0b;"></i> turn around the phone to look around</li>
            <li class="mb-3"><i class="fas fa-arrows-alt me-2" style="color: #f59e0b;"></i> use arrow buttons to move</li>
            <li><i class="fas fa-sign-in-alt me-2" style="color: #f59e0b;"></i> click on the sign to go participants</li>
          </ul>
        `,
        'mobile-basic': `
          <ul class="text-start list-unstyled ps-0 mb-0" style="line-height: 1.8; font-size: 0.95rem; color: #cbd5e1;">
            <li class="mb-3"><i class="fas fa-fingerprint me-2" style="color: #f59e0b;"></i> Drag around the screen to look around</li>
            <li class="mb-3"><i class="fas fa-arrows-alt me-2" style="color: #f59e0b;"></i> use arrow buttons to move around</li>
            <li><i class="fas fa-sign-in-alt me-2" style="color: #f59e0b;"></i> click on the sign to go participants</li>
          </ul>
        `
      };

      const guideModal = document.getElementById('guideDisplayModal');
      const modalTitle = document.getElementById('guideModalTitle');
      const modalBody = document.getElementById('guideModalBody');
      const closeBtn = document.getElementById('closeGuideModalBtn');
      let chosenMobileContext = 'mobile-basic'; // Track layout preference context

      if (closeBtn) {
        closeBtn.addEventListener('click', () => { guideModal.style.display = 'none'; });
      }

      function openModalGuide(modeKey) {
        if (modeKey === 'laptop') {
          modalTitle.innerHTML = '<i class="fas fa-laptop me-2"></i> Laptop Guide';
          modalBody.innerHTML = exhibitionGuides['laptop'];
        } else if (modeKey === 'mobile-ar') {
          modalTitle.innerHTML = '<i class="fas fa-vr-cardboard me-2"></i> AR Guide';
          modalBody.innerHTML = exhibitionGuides['mobile-ar'];
        } else if (modeKey === 'mobile-basic') {
          modalTitle.innerHTML = '<i class="fas fa-mobile-alt me-2"></i> Basic Guide';
          modalBody.innerHTML = exhibitionGuides['mobile-basic'];
        }
        guideModal.style.display = 'flex';
      }

      // Append floating trigger menu button ONLY if device is recognized as phone/tablet
      if (isMobile) {
        let mobileInfoBtn = document.createElement('div');
        mobileInfoBtn.id = 'mobileGuideInfoBtn';
        mobileInfoBtn.style.cssText = 'position:fixed; top:20px; right:20px; width:44px; height:44px; background:rgba(30,41,59,0.9); border:1px solid #f59e0b; color:#f59e0b; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.3rem; cursor:pointer; z-index:9999; box-shadow:0 4px 15px rgba(0,0,0,0.4);';
        mobileInfoBtn.innerHTML = '<i class="fas fa-info-circle"></i>';
        document.body.appendChild(mobileInfoBtn);

        mobileInfoBtn.addEventListener('click', () => {
          openModalGuide(chosenMobileContext);
        });
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Virtual Winners Exhibition - 3D Pillars Hall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #440613 0%, #540818 100%);
        -webkit-tap-highlight-color: transparent;
      }

      /* Native background webcam stream styling */
      #webcam-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
        display: none;
      }

      a-scene, .a-canvas {
        background-color: transparent !important;
        background: transparent !important;
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #440613 0%, #540818 100%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .overlay-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #f59e0b;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      }

      p {
        margin: 0 0 30px 0;
        font-size: 1rem;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.5;
      }

      .start-btn {
        background: #f59e0b;
        color: #0f172a;
        border: none;
        padding: 14px 36px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .start-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(245, 158, 11, 0.5);
        background: #fbbf24;
      }

      #move-hint {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
        padding: 10px 20px;
        border-radius: 30px;
        font-family: monospace;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 90;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        text-align: center;
      }

      #nav-hud-status {
        position: fixed;
        bottom: 30px;
        left: 30px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
        padding: 12px 20px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 95;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        line-height: 1.6;
        text-align: left;
      }
      #nav-hud-status b {
        color: #ffffff;
      }
    </style>

    <script>
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const moveHint = document.getElementById('move-hint');
      const hudStatus = document.getElementById('nav-hud-status');
      const scene = document.querySelector('a-scene');
      const nativeVideo = document.getElementById('webcam-video');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      
      let touchStartX = 0;
      let touchStartY = 0;

      const activeKeys = {};
      const moveSpeed = 0.12; 

      const forceSceneClearTransparency = () => {
        if (scene) {
          scene.style.backgroundColor = "transparent";
          scene.style.background = "transparent";
        }
        document.querySelectorAll('.a-canvas').forEach(canvas => {
          canvas.style.backgroundColor = "transparent";
          canvas.style.background = "transparent";
        });
        if (scene && scene.renderer) {
          scene.renderer.setClearColor(0x000000, 0);
        }
      };

      function moveRigWithStrictCarpetBounds(forwardAmount, strafeAmount) {
        const rig = document.getElementById('camera-rig');
        const cam = document.getElementById('main-camera');
        if (!rig || !cam) return;

        let rotation = cam.getAttribute('rotation');
        let angleRad = (rotation.y * Math.PI) / 180;
        let currentPos = rig.getAttribute('position');
        
        let nextX = currentPos.x - Math.sin(angleRad) * forwardAmount;
        let nextZ = currentPos.z - Math.cos(angleRad) * forwardAmount;

        nextX += Math.cos(angleRad) * strafeAmount;
        nextZ -= Math.sin(angleRad) * strafeAmount;

        const CARPET_MAX_X = 1.3; 
        const CARPET_MIN_X = -1.3;
        const CORRIDOR_MAX_Z = 6.0;
        const CORRIDOR_MIN_Z = -54.0;

        if (nextX > CARPET_MAX_X || nextX < CARPET_MIN_X || nextZ > CORRIDOR_MAX_Z || nextZ < CORRIDOR_MIN_Z) {
          return; 
        }

        rig.setAttribute('position', { x: nextX, y: currentPos.y, z: nextZ });
      }

      if (isMobile) {
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) {
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            
            let diffX = currentX - touchStartX;
            let diffY = touchStartY - currentY; 

            let forwardWalk = 0;
            let strafeWalk = 0;

            // Check if screen is flipped to horizontal (Landscape)
            if (window.innerWidth > window.innerHeight) {
              // LANDSCAPE MODE:
              // Moving up/down on the short side (diffY) now goes Forward/Backward
              // Moving left/right on the long side (diffX) now goes Left/Right
              forwardWalk = diffY * 0.0020;
              strafeWalk = diffX * 0.0020;
            } else {
              // PORTRAIT MODE:
              // Standard vertical behavior
              forwardWalk = diffY * 0.0020;
              strafeWalk = diffX * 0.0020;
            }

            moveRigWithStrictCarpetBounds(forwardWalk, strafeWalk);
          }
        });
      }

      else {
        document.getElementById('main-camera').setAttribute('look-controls', 'pointerLockEnabled: true; touchEnabled: false;');

        document.addEventListener('keydown', (e) => {
          activeKeys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('mouseup', (e) => {});
        document.addEventListener('keyup', (e) => {
          activeKeys[e.key.toLowerCase()] = false;
        });

        function gameLoop() {
          let forward = 0;
          let strafe = 0;

          if (activeKeys['w'] || activeKeys['arrowup']) forward += moveSpeed;
          if (activeKeys['s'] || activeKeys['arrowdown']) forward -= moveSpeed;
          if (activeKeys['d'] || activeKeys['arrowright']) strafe += moveSpeed;
          if (activeKeys['a'] || activeKeys['arrowleft']) strafe -= moveSpeed;

          if (forward !== 0 || strafe !== 0) {
            moveRigWithStrictCarpetBounds(forward, strafe);
          }
          requestAnimationFrame(gameLoop);
        }

        document.addEventListener('pointerlockchange', () => {
          if (document.pointerLockElement) {
            hudStatus.innerHTML = "• Controls: <b>WASD / Arrows</b> to Move<br>• Press <b>ESC</b> to free mouse cursor";
          } else {
            hudStatus.innerHTML = "• View Mode Paused<br>• <b>Click scene</b> to lock cursor & walk again";
          }
        });

        document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(gameLoop);
        });
      }

      function activateMobilePermissions() {
        // iOS strict compliance check for Motion sensors
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(permissionState => {
              if (permissionState !== 'granted') {
                console.warn("DeviceOrientation access rejected.");
              }
            })
            .catch(console.error);
        }

        // Initialize background hardware camera pipeline
        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
        })
        .then((stream) => {
          nativeVideo.srcObject = stream;
          nativeVideo.addEventListener('playing', () => {
            forceSceneClearTransparency();
            nativeVideo.style.display = "block";
          }, { once: true });
          nativeVideo.play().catch(e => console.log(e));
        })
        .catch((err) => {
          console.error("Camera access blocked:", err);
          if (scene) scene.style.backgroundColor = "#0b0f19"; 
        });
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        
        if (isMobile) {
          moveHint.innerHTML = "Rotate phone to Look around · Drag on screen to Walk";
          moveHint.style.display = 'block';
          forceSceneClearTransparency();
          activateMobilePermissions();
        } else {
          moveHint.innerHTML = "Click on screen to lock cursor and start exploring!";
          hudStatus.innerHTML = "• Controls: <b>WASD / Arrows</b> to Move<br>• Press <b>ESC</b> to free mouse cursor";
          hudStatus.style.display = 'block';
          moveHint.style.display = 'block';
          if (scene) scene.style.backgroundColor = "#0b0f19";
        }
      });



      // Click navigation, hover glow, and canvas-rendered 3D tooltip engine
      document.addEventListener('DOMContentLoaded', () => {
        const exhibitionSign = document.getElementById('btn-to-exhibition');
        const signGlow = document.getElementById('sign-glow');
        const signTooltip = document.getElementById('sign-tooltip');

        // Dynamically build a small canvas image texture for the muted tooltip text
        if (signTooltip) {
          const canvas = document.createElement('canvas');
          canvas.width = 256;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          
          // Background Color: Muted Dark Slate Gray (#1e293b)
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          // Clean Muted Text Color: Soft Gold tint (#f59e0b)
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 26px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('CLICK ME', canvas.width / 2, canvas.height / 2);
          
          // Inject canvas draw into the material pipeline
          signTooltip.setAttribute('material', 'src', canvas);
        }

        if (exhibitionSign) {
          // When the viewer places the yellow circle cursor anywhere on the sign
          exhibitionSign.addEventListener('mouseenter', () => {
            if (signGlow) signGlow.setAttribute('material', 'opacity', '0.25');
            if (signTooltip) signTooltip.setAttribute('visible', 'true');
          });

          // When the viewer looks away from the sign
          exhibitionSign.addEventListener('mouseleave', () => {
            if (signGlow) signGlow.setAttribute('material', 'opacity', '0');
            if (signTooltip) signTooltip.setAttribute('visible', 'false');
          });

          // Direct click/tap navigation handler on parent container
          exhibitionSign.addEventListener('click', () => {
            window.location.href = 'exhibition.html';
          });

          // Fallback listeners attached to nested elements to ensure mobile touch taps execute
          const innerClickables = exhibitionSign.querySelectorAll('.clickable');
          innerClickables.forEach(element => {
            element.addEventListener('click', (e) => {
              e.stopPropagation();
              window.location.href = 'exhibition.html';
            });
          });
        }
      });



    </script>

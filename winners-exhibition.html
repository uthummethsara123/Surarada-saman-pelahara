<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Virtual Winners Exhibition - 3D Pillars Hall</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
      }

      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .overlay-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #f59e0b;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      }

      p {
        margin: 0 0 30px 0;
        font-size: 1rem;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.5;
      }

      .start-btn {
        background: #f59e0b;
        color: #0f172a;
        border: none;
        padding: 14px 36px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .start-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(245, 158, 11, 0.5);
        background: #fbbf24;
      }

      #move-hint {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
        padding: 10px 20px;
        border-radius: 30px;
        font-family: monospace;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 90;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        text-align: center;
      }

      #nav-hud-status {
        position: fixed;
        bottom: 30px;
        left: 30px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
        padding: 12px 20px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 95;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        line-height: 1.6;
        text-align: left;
      }
      #nav-hud-status b {
        color: #ffffff;
      }
    </style>
  </head>

    <script>
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const moveHint = document.getElementById('move-hint');
      const hudStatus = document.getElementById('nav-hud-status');
      const scene = document.querySelector('a-scene');

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      
      // Touch coordinates for multi-directional vector movement
      let touchStartX = 0;
      let touchStartY = 0;

      const activeKeys = {};
      const moveSpeed = 0.12; 

      // UNIVERSAL CARPET-BOUNDED COLLISION ENGINE
      function moveRigWithStrictCarpetBounds(forwardAmount, strafeAmount) {
        const rig = document.getElementById('camera-rig');
        const cam = document.getElementById('main-camera');
        if (!rig || !cam) return;

        let rotation = cam.getAttribute('rotation');
        let angleRad = (rotation.y * Math.PI) / 180;
        let currentPos = rig.getAttribute('position');
        
        let nextX = currentPos.x - Math.sin(angleRad) * forwardAmount;
        let nextZ = currentPos.z - Math.cos(angleRad) * forwardAmount;

        nextX += Math.cos(angleRad) * strafeAmount;
        nextZ -= Math.sin(angleRad) * strafeAmount;

        // Strict boundary parameters
        const CARPET_MAX_X = 1.3; 
        const CARPET_MIN_X = -1.3;
        const CORRIDOR_MAX_Z = 6.0;
        const CORRIDOR_MIN_Z = -54.0;

        if (nextX > CARPET_MAX_X || nextX < CARPET_MIN_X || nextZ > CORRIDOR_MAX_Z || nextZ < CORRIDOR_MIN_Z) {
          return; 
        }

        rig.setAttribute('position', { x: nextX, y: currentPos.y, z: nextZ });
      }

      // --- MOBILE SETUP: DEVICE ORIENTATION VIEW + WASD SWIPE MOTION TRACKING ---
      if (isMobile) {
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) {
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            
            let diffX = currentX - touchStartX;
            let diffY = touchStartY - currentY; // Invert logic: push up to step forward

            // Convert raw swipe deltas into precise vector inputs
            let forwardWalk = diffY * 0.0004;
            let strafeWalk = diffX * 0.0004;

            moveRigWithStrictCarpetBounds(forwardWalk, strafeWalk);
          }
        });
      } else {
        // --- DESKTOP KEYBOARD ENGINE ---
        document.getElementById('main-camera').setAttribute('look-controls', 'pointerLockEnabled: true; touchEnabled: false;');

        document.addEventListener('keydown', (e) => {
          activeKeys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
          activeKeys[e.key.toLowerCase()] = false;
        });

        function gameLoop() {
          let forward = 0;
          let strafe = 0;

          if (activeKeys['w'] || activeKeys['arrowup']) forward += moveSpeed;
          if (activeKeys['s'] || activeKeys['arrowdown']) forward -= moveSpeed;
          if (activeKeys['d'] || activeKeys['arrowright']) strafe += moveSpeed;
          if (activeKeys['a'] || activeKeys['arrowleft']) strafe -= moveSpeed;

          if (forward !== 0 || strafe !== 0) {
            moveRigWithStrictCarpetBounds(forward, strafe);
          }
          requestAnimationFrame(gameLoop);
        }

        document.addEventListener('pointerlockchange', () => {
          if (document.pointerLockElement) {
            hudStatus.innerHTML = "• Controls: <b>WASD / Arrows</b> to Move<br>• Press <b>ESC</b> to free mouse cursor";
          } else {
            hudStatus.innerHTML = "• View Mode Paused<br>• <b>Click scene</b> to lock cursor & walk again";
          }
        });

        document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(gameLoop);
        });
      }

      // Safe Device Orientation Permissions Check for Mobile Devices
      function requestDeviceOrientationAccess() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(permissionState => {
              if (permissionState !== 'granted') {
                console.warn("DeviceOrientation disabled by user.");
              }
            })
            .catch(console.error);
        }
      }

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        
        if (isMobile) {
          requestDeviceOrientationAccess();
          moveHint.innerHTML = "Rotate phone to Look around · Drag on screen to Walk";
          moveHint.style.display = 'block';
        } else {
          moveHint.innerHTML = "Click on screen to lock cursor and start exploring!";
          hudStatus.innerHTML = "• Controls: <b>WASD / Arrows</b> to Move<br>• Press <b>ESC</b> to free mouse cursor";
          hudStatus.style.display = 'block';
          moveHint.style.display = 'block';
        }
      });
    </script>
